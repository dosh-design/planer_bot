# Builds the Android app on every push that touches mobile/. The APK is a test build: download it from the run's
# «Artifacts» and install it on an Android phone. A signed release for the stores is built by Codemagic (codemagic.yaml).
name: Android test build
on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: dogovorilis-android-test
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk

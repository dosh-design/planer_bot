<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Договорились</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============ design tokens ============ */
:root{
  /* colour, light. Text pairs checked for WCAG AA: --text-2 on --surface 5.2, --danger-ink on --surface 5.5 */
  --bg:#FFF8F0; --surface:#FFFFFF; --surface-2:#FFF1DE;
  --text:#342A25; --text-2:#7A6A5F; --text-3:#A8978A;
  --brand:#EA754A; --brand-fill:#C4502C; --brand-ink:#B94E27; --brand-soft:#FCE6D8; --on-brand:#FFFFFF;
  --danger:#E54848; --danger-ink:#C53030; --danger-soft:#FFF0EE;
  --warning:#E7A93E; --warning-ink:#94620F; --warning-soft:#FFF5D9;
  --success:#65966B; --success-ink:#3F7346; --success-soft:#EAF4E8;
  --border:#F0E2D4; --control:#A08A7A;
  --shadow-1:0 1px 2px rgba(52,42,37,.05);
  --shadow-2:0 10px 30px rgba(52,42,37,.12);
  --scrim:rgba(36,26,20,.42);
  /* type: one family (already used by the app), four weights */
  --font:Nunito,ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
  --t-display:800 26px/1.15 var(--font);
  --t-section:800 20px/1.2 var(--font);
  --t-title:600 16px/1.3 var(--font);
  --t-body:500 15px/1.45 var(--font);
  --t-caption:600 13px/1.35 var(--font);
  --t-micro:700 11px/1.2 var(--font);
  /* space, radius, motion */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px;
  --r-s:10px; --r-m:14px; --r-l:18px; --r-xl:24px; --r-full:999px;
  --ease:cubic-bezier(.2,.8,.2,1); --fast:.16s; --base:.26s;
}
:root{
  /* Safe areas, one source for every edge: the browser's env() on its own, Telegram's insets in full screen
     (set by insets() in the script). max(), never a sum: the same notch is not counted twice. */
  --safe-top:max(env(safe-area-inset-top, 0px), var(--inset-top, 0px));
  --safe-bottom:max(env(safe-area-inset-bottom, 0px), var(--inset-bottom, 0px));
}
:root[data-theme="dark"]{
  --bg:#1A1512; --surface:#241D19; --surface-2:#2E2520;
  --text:#F4EAE2; --text-2:#B5A397; --text-3:#7E6E63;
  --brand:#F08A62; --brand-fill:#F08A62; --brand-ink:#F5A07E; --brand-soft:#3A2419; --on-brand:#1A1512;
  --danger:#FF6B6B; --danger-ink:#FF8A8A; --danger-soft:#3A1D1D;
  --warning:#F0BC5E; --warning-ink:#F0BC5E; --warning-soft:#36291A;
  --success:#8DBF8F; --success-ink:#A3D0A5; --success-soft:#1E2B20;
  --border:#362C26; --control:#8A786C;
  --shadow-1:none; --shadow-2:0 10px 30px rgba(0,0,0,.45); --scrim:rgba(0,0,0,.55);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1A1512; --surface:#241D19; --surface-2:#2E2520;
    --text:#F4EAE2; --text-2:#B5A397; --text-3:#7E6E63;
    --brand:#F08A62; --brand-fill:#F08A62; --brand-ink:#F5A07E; --brand-soft:#3A2419; --on-brand:#1A1512;
    --danger:#FF6B6B; --danger-ink:#FF8A8A; --danger-soft:#3A1D1D;
    --warning:#F0BC5E; --warning-ink:#F0BC5E; --warning-soft:#36291A;
    --success:#8DBF8F; --success-ink:#A3D0A5; --success-soft:#1E2B20;
    --border:#362C26; --control:#8A786C;
    --shadow-1:none; --shadow-2:0 10px 30px rgba(0,0,0,.45); --scrim:rgba(0,0,0,.55);
  }
}

/* ============ base ============ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--bg);color:var(--text);font:var(--t-body)}
/* App shell: the list scrolls in its own area and the composer sits BELOW it, not on top of it.
   Height follows the visible viewport (keyboard, Telegram's expand), see fit() in the script. */
.app{position:fixed;left:0;right:0;top:var(--app-top,0px);height:var(--app-h,100%);display:flex;flex-direction:column;
  padding-top:var(--safe-top)}  /* full screen in Telegram: room for the status bar and Telegram's own buttons */
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  padding:0 var(--s4) var(--s3)}
button{font:inherit;color:inherit}
[hidden]{display:none !important}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* ============ header: who and when, three counters, the next plan ============ */
.top{padding:var(--s3) 0 0}
.bar{display:flex;align-items:center;gap:10px}
.mark{width:36px;height:36px;border-radius:11px;background:var(--brand);color:#fff;display:grid;place-items:center;flex:none}
.mark .ic{width:21px;height:21px;stroke-width:2.1}
.title-block{flex:1;min-width:0}
h1{font:800 21px/1.15 var(--font);letter-spacing:-.4px;margin:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
h1.solo{white-space:normal;font-size:19px;overflow-wrap:anywhere}
.date{font:var(--t-caption);color:var(--text-2);margin-top:1px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.date::first-letter{text-transform:uppercase}
.pair{display:flex;align-items:center;flex:none}
.ava{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:800 13px/1 var(--font);
  color:#fff;border:2px solid var(--bg);background:var(--brand-fill);flex:none}
.pair .ava + .ava{margin-left:-9px;background:var(--success)}
.pair button.ava{cursor:pointer;padding:0}
.chatbtn{position:relative;width:36px;height:36px;margin-right:10px;border:0;border-radius:50%;background:var(--surface-2);color:var(--text);display:grid;place-items:center;cursor:pointer;flex:none}
.chatbtn .ic{width:19px;height:19px}
.chatbtn .badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--danger);color:#fff;font:800 11px/18px var(--font);text-align:center}
.chat{display:flex;flex-direction:column;gap:6px;padding:var(--s2) 0 var(--s4)}
.chat .day{align-self:center;margin:var(--s2) 0 2px;font:var(--t-caption);color:var(--text-2)}
.msg{max-width:82%;align-self:flex-start;padding:8px 12px 6px;border-radius:18px 18px 18px 6px;background:var(--surface);border:1px solid var(--border);font:500 15px/1.4 var(--font);white-space:pre-wrap;overflow-wrap:anywhere}
.msg.mine{align-self:flex-end;border-radius:18px 18px 6px 18px;background:var(--brand-fill);border-color:transparent}
.composer.chatting .hint{display:none}
.msg time{display:block;margin-top:2px;text-align:right;font:500 11px/1 var(--font);color:var(--text-2)}
.ava.big{width:48px;height:48px;font-size:20px;flex:none}
label.opt{cursor:pointer}
.ava.wait{background:var(--surface-2);color:var(--text-2);border-style:dashed;border-color:var(--control);padding:0;cursor:pointer}
.ava.wait .ic{width:16px;height:16px;stroke-width:2}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s2);margin-top:var(--s3)}
.stat{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:44px;padding:0 var(--s3);border-radius:var(--r-m);
  background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-1);cursor:pointer;text-align:left;
  transition:transform var(--fast) var(--ease)}
.stat:active{transform:scale(.97)}
.stat span{font:600 13px/1.2 var(--font);color:var(--text-2);min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.stat b{font:800 18px/1 var(--font);letter-spacing:-.3px}
.stat.muted b{color:var(--text-3)}
/* the only coloured counter: what needs attention; red if something is really overdue */
.stat.hot{background:var(--warning-soft);border-color:transparent}
.stat.hot span,.stat.hot b{color:var(--warning-ink)}
.stat.hot.late{background:var(--danger-soft)}
.stat.hot.late span,.stat.hot.late b{color:var(--danger-ink)}
@media (max-width:360px){ .stat{padding:0 10px} .stat span{font-size:12px} }

.plan{display:flex;align-items:center;gap:var(--s2);width:100%;min-height:44px;margin-top:var(--s2);padding:0 var(--s2) 0 var(--s3);
  border:0;border-radius:var(--r-m);background:var(--brand-soft);color:var(--text);cursor:pointer;text-align:left}
.plan > .ic{color:var(--brand-ink);width:18px;height:18px}
.plan span{flex:1;min-width:0;font:600 14px/1.25 var(--font);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.plan span small{font:var(--t-caption);color:var(--text-2)}
.plan b{color:var(--brand-ink);font-weight:800}
.plan .go{color:var(--text-2);width:16px;height:16px}
@media (max-width:360px){ .plan{padding-top:6px;padding-bottom:6px} .plan span{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical} }
.note{display:flex;gap:var(--s2);align-items:flex-start;font:var(--t-caption);color:var(--text-2);margin-top:var(--s2)}
.note .ic{width:16px;height:16px;margin-top:1px}

.invite{display:flex;gap:var(--s3);align-items:center;background:var(--surface);border:1px dashed var(--control);
  border-radius:var(--r-l);padding:var(--s3) var(--s4);margin-top:var(--s3)}
.invite p{margin:0;flex:1;font:var(--t-caption);color:var(--text-2)}
.invite p b{display:block;font:var(--t-title);color:var(--text);margin-bottom:2px}
.btn{border:0;border-radius:var(--r-m);background:var(--brand-fill);color:var(--on-brand);font:800 14px/1 var(--font);
  padding:0 var(--s4);min-height:44px;cursor:pointer;white-space:nowrap}
.btn.ghost{background:var(--surface-2);color:var(--text)}

/* ============ tabs ============ */
.tabs{position:sticky;top:0;z-index:3;display:flex;gap:2px;padding:4px;margin:var(--s3) 0 var(--s1);
  background:var(--surface-2);border-radius:var(--r-m);box-shadow:0 0 0 6px var(--bg)}
.tabs button{flex:1;min-width:0;border:0;background:none;color:var(--text-2);font:700 11.5px/1 var(--font);min-height:48px;
  border-radius:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0 2px;
  transition:background var(--fast),color var(--fast);white-space:nowrap}
.tabs button .ic{width:18px;height:18px}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow-1)}
/* five sections: icon over a short label, so they fit down to 320 px */
@media (max-width:350px){ .tabs{gap:0;padding:3px} .tabs button{font-size:10.5px;letter-spacing:-.35px;padding:0} }

/* ============ sections ============ */
main{animation:in var(--base) var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.sec{display:flex;align-items:center;gap:var(--s2);margin:var(--s5) 0 var(--s2)}
.sec h2{font:800 18px/1.2 var(--font);letter-spacing:-.3px;margin:0;min-width:0;overflow-wrap:anywhere}
.sec .count{font:700 13px/1 var(--font);color:var(--text-2);background:var(--surface-2);border-radius:var(--r-full);padding:4px 8px}
.sec.hot h2{text-transform:uppercase;letter-spacing:.4px;font-size:16px}
.sec.past h2{color:var(--text-2);font-size:16px}
.sec .ava{width:24px;height:24px;font-size:11px;border:0}
.sec .ava.both{background:var(--brand)}
.tile-row{display:flex;align-items:center;gap:var(--s2);width:100%;min-height:48px;padding:var(--s2) var(--s3);margin-top:var(--s2);
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-m);color:var(--text);font:600 14px/1.35 var(--font);text-align:left;cursor:pointer}
.tile-row > span{flex:1;min-width:0}
.tile-row .ic{width:18px;height:18px;color:var(--text-2);flex:none}
.proj-head{display:flex;justify-content:flex-end;margin-top:var(--s4)}
.btn .ic{width:16px;height:16px;vertical-align:-3px;margin-right:2px}
.proj-card{display:flex;gap:10px;align-items:center;width:100%;margin-top:var(--s2);padding:var(--s3);background:var(--surface);
  border:1px solid var(--border);border-radius:var(--r-l);color:var(--text);text-align:left;cursor:pointer}
.proj-card .tile{width:36px;height:36px;border-radius:11px;background:var(--brand-soft);color:var(--brand-ink);display:grid;place-items:center;flex:none;align-self:flex-start}
.proj-card .pbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.proj-card b{font:var(--t-title);overflow-wrap:anywhere}
.proj-card small{font:var(--t-caption);color:var(--text-2);overflow-wrap:anywhere}
.proj-card .progress{margin:4px 0 0}
.proj-card .go{width:16px;height:16px;color:var(--text-2);flex:none}
.back{display:inline-flex;align-items:center;gap:4px;margin-top:var(--s3);min-height:40px;padding:0 var(--s2) 0 0;border:0;background:none;color:var(--brand-ink);font:700 14px/1 var(--font);cursor:pointer}
.back .ic{width:18px;height:18px}
.proj-page{margin-top:var(--s2);padding:var(--s4);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl)}
.proj-page .ph{display:flex;align-items:flex-start;gap:var(--s2)}
.proj-page h2{flex:1;min-width:0;margin:0;font:800 22px/1.2 var(--font);letter-spacing:-.4px;overflow-wrap:anywhere}
.proj-page p{margin:6px 0 0;font:500 14px/1.45 var(--font);color:var(--text-2);overflow-wrap:anywhere}
.proj-page .meta{display:flex;align-items:center;gap:var(--s2);margin:var(--s3) 0 var(--s2);font:var(--t-caption);color:var(--text-2)}
.proj-page .people{display:flex}
.proj-page .people .ava{width:24px;height:24px;font-size:11px;border:2px solid var(--surface);margin-right:-6px}
.proj-page .people + span{margin-left:8px}
.proj-page .progress{margin:0}
.proj-page .addto{width:40px;height:40px;border-radius:var(--r-full);border:0;background:var(--surface-2);color:var(--text);display:grid;place-items:center;cursor:pointer;flex:none}
.proj-page .addto .ic{width:18px;height:18px}
.card.done-row{opacity:.7;align-items:center}
.card.done-row .tile{background:var(--success-soft,var(--surface-2));color:var(--success)}
.card.done-row .title{text-decoration:line-through;text-decoration-color:var(--text-3);color:var(--text-2)}
.undo{border:0;background:var(--surface-2);color:var(--text);font:700 13px/1 var(--font);min-height:36px;padding:0 var(--s3);border-radius:var(--r-full);cursor:pointer;flex:none}
.ideas.left{justify-content:flex-start;margin:0}
.busy-list{margin-top:var(--s5)}
.sec.proj{margin-bottom:var(--s1)}
.sec .addto{margin-left:auto;width:36px;height:36px;border-radius:var(--r-full);border:0;background:var(--surface-2);color:var(--text);display:grid;place-items:center;cursor:pointer;flex:none}
.sec .addto .ic{width:18px;height:18px}
/* a progress line; not .bar, which is the header row (sharing the name squeezed the header to 6 px) */
.progress{height:6px;border-radius:var(--r-full);background:var(--surface-2);overflow:hidden;margin:0 0 var(--s2)}
.progress i{display:block;height:100%;background:var(--success);border-radius:inherit}
.sec .ava .ic{width:14px;height:14px;stroke-width:2.2}
/* «Семья против бытового хаоса»: one shared score, never a partner-vs-partner table */
.score-card{display:flex;align-items:center;gap:var(--s3);width:100%;margin-top:var(--s3);padding:var(--s3) var(--s4);text-align:left;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-l);box-shadow:var(--shadow-1);color:var(--text);cursor:pointer;font:inherit}
.score-card .tile{width:40px;height:40px;border-radius:12px;background:var(--brand-soft);color:var(--brand-ink);display:grid;place-items:center;flex:none}
.score-card .tile .ic{width:22px;height:22px}
.score-card .sbody{flex:1;min-width:0}
.score-line{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 8px;font:700 14px/1.2 var(--font);color:var(--text-2)}
.score-line b{font:800 24px/1 var(--font);color:var(--text);font-variant-numeric:tabular-nums}
.score-line .fam b{color:var(--brand-ink)}
.score-line .sep{font:800 20px/1 var(--font);color:var(--text-3)}
.score-card small{display:block;margin-top:4px;font:var(--t-caption);color:var(--text-2);overflow-wrap:anywhere}
.score-card .go{width:18px;height:18px;color:var(--text-2);flex:none}
.season{margin-top:var(--s2);padding:var(--s4);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl)}
.season h2{margin:0;font:800 22px/1.2 var(--font);letter-spacing:-.4px}
.season .vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:var(--s2);margin:var(--s4) 0 var(--s2);text-align:center}
.season .vs b{display:block;font:800 40px/1 var(--font);font-variant-numeric:tabular-nums}
.season .vs .fam b{color:var(--brand-ink)}
.season .vs span{font:700 13px/1.2 var(--font);color:var(--text-2)}
.season .vs .colon{font:800 30px/1 var(--font);color:var(--text-3)}
.season p{margin:6px 0 0;font:500 14px/1.45 var(--font);color:var(--text-2)}
.season .progress i{background:var(--brand)}
.match{display:flex;align-items:center;gap:var(--s2);padding:10px 0;border-top:1px solid var(--border);font:600 14px/1.3 var(--font)}
.match:first-of-type{border-top:0}
.match span{flex:1;min-width:0;color:var(--text-2)}
.match b{font-variant-numeric:tabular-nums}
.chip{padding:3px 9px;border-radius:var(--r-full);font:700 12px/1.3 var(--font);white-space:nowrap}
.chip.family{background:var(--success-soft);color:var(--success-ink)}
.chip.chaos{background:var(--warning-soft);color:var(--warning-ink)}
.chip.draw{background:var(--surface-2);color:var(--text-2)}
.panel{margin-top:var(--s2);padding:var(--s2) var(--s4);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-l)}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:var(--s2);margin-top:var(--s2)}
.ach > div{padding:var(--s3);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-m);min-width:0}
.ach .em{font-size:24px;line-height:1}
.ach b{display:block;margin-top:6px;font:800 14px/1.25 var(--font);overflow-wrap:anywhere}
.ach small{display:block;margin-top:3px;font:500 12px/1.35 var(--font);color:var(--text-2);overflow-wrap:anywhere}
.ach .locked{background:transparent;border-style:dashed}
.ach .locked .em{filter:grayscale(1);opacity:.45}
.ach .locked b{color:var(--text-2)}
.ach .when{color:var(--success-ink);font-weight:700}
.rules{margin:0;padding:var(--s2) 0 var(--s2) 18px;font:500 14px/1.45 var(--font);color:var(--text-2)}
.rules li + li{margin-top:6px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:var(--s2) 0}
.modes button{min-height:44px;padding:6px 8px;border-radius:var(--r-m);border:1px solid var(--border);background:var(--surface);color:var(--text);font:700 14px/1.2 var(--font);cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--brand-fill);border-color:var(--brand-fill);color:var(--on-brand)}
.calm{display:flex;gap:var(--s3);align-items:center;margin-top:var(--s5);padding:var(--s3) var(--s4);border-radius:var(--r-m);
  background:var(--success-soft);color:var(--success-ink);font:var(--t-caption)}
.calm .ic{width:18px;height:18px}

/* ============ card ============ */
.card{position:relative;display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-l);padding:10px 8px 10px var(--s3);margin-bottom:var(--s2);box-shadow:var(--shadow-1);cursor:pointer;max-height:600px;
  transition:opacity var(--base) var(--ease),transform var(--base) var(--ease),max-height var(--base) var(--ease),margin var(--base),padding var(--base)}
.card .tile{width:36px;height:36px;border-radius:11px;background:var(--surface-2);color:var(--text-2);display:grid;place-items:center;flex:none}
.card.k-event .tile{background:var(--brand-soft);color:var(--brand-ink)}
.card .body{flex:1;min-width:0;padding-top:2px}
.card .title{font:var(--t-title);overflow-wrap:anywhere;hyphens:auto}
.card .due{display:flex;align-items:center;gap:5px;margin-top:2px;font:var(--t-caption);color:var(--text-2)}
.card .due .ic{width:15px;height:15px}
/* One status signal per card: the due line. Red pill = past its date, amber pill = hanging a week+,
   coral text = today, grey = later or already past (joint plans). Border and tile stay neutral. */
.card .due.late,.card .due.hang{width:fit-content;max-width:100%;padding:2px 8px 2px 6px;border-radius:var(--r-full);margin-top:4px}
.card .due.late{color:var(--danger-ink);background:var(--danger-soft)}
.card .due.hang{color:var(--warning-ink);background:var(--warning-soft)}
.card .due.today{color:var(--brand-ink)}
.card .due.past{color:var(--text-3)}
.card .who{display:flex;align-items:center;gap:6px;margin-top:3px;font:500 13px/1.3 var(--font);color:var(--text-2)}
.card .who .ava{width:18px;height:18px;font-size:9px;border:0}
.card .who .ic{width:16px;height:16px}
.card.past{box-shadow:none;background:transparent}
.card.past .title{color:var(--text-2)}
.tick{width:44px;height:44px;margin:-4px 0 -4px 0;border:0;background:none;padding:0;display:grid;place-items:center;cursor:pointer;flex:none}
.tick i{width:28px;height:28px;border-radius:50%;border:1.8px solid var(--control);display:grid;place-items:center;color:transparent;
  transition:all var(--fast) var(--ease)}
.tick .ic{width:16px;height:16px;stroke-width:2.6}
.tick:hover i{border-color:var(--success)}
.card.done{opacity:.6;box-shadow:none}
.card.done .title{text-decoration:line-through;text-decoration-color:var(--text-3);color:var(--text-2)}
.card.done .tick i{background:var(--success);border-color:var(--success);color:#fff;transform:scale(1.08)}
.card.gone{opacity:0;transform:translateX(24px);max-height:0;margin:0;padding-top:0;padding-bottom:0;border-width:0;overflow:hidden}
.card.fresh{animation:pop .6s var(--ease)}
@keyframes pop{0%{transform:scale(.97);background:var(--brand-soft)}100%{transform:none}}
.warn{display:flex;gap:6px;align-items:flex-start;margin-top:6px;padding:6px var(--s2);border-radius:var(--r-s);
  background:var(--warning-soft);color:var(--text);font:500 13px/1.35 var(--font)}
.warn .ic{width:15px;height:15px;color:var(--warning-ink);margin-top:1px}
.warn b{font-weight:800;color:var(--warning-ink)}
.warn u{text-decoration:none;font-weight:800;color:var(--warning-ink);white-space:nowrap}

/* ============ calendar ============ */
.cal{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-l);padding:var(--s2) var(--s2) var(--s3);margin-top:var(--s3);box-shadow:var(--shadow-1)}
.cal-head{display:flex;align-items:center;gap:var(--s1);padding:0 0 var(--s2)}
.cal-head .nav{width:44px;height:44px;border:0;border-radius:12px;background:none;color:var(--text-2);display:grid;place-items:center;cursor:pointer}
.cal-title{flex:1;min-width:0;text-align:center;font:800 16px/1.2 var(--font);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cal-title::first-letter{text-transform:uppercase}
/* the switch shows the mode that IS on, both options visible */
.cal-mode{display:flex;gap:2px;padding:3px;margin:0 auto var(--s2);width:max-content;background:var(--surface-2);border-radius:var(--r-full)}
.cal-mode button{border:0;background:none;color:var(--text-2);font:700 13px/1 var(--font);min-height:36px;min-width:84px;padding:0 var(--s3);border-radius:var(--r-full);cursor:pointer}
.cal-mode button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow-1)}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.cal-wd{text-align:center;font:var(--t-micro);color:var(--text-2);padding:2px 0 6px;text-transform:uppercase;letter-spacing:.4px}
.cal-wd.we{color:var(--brand-ink)}
.cal-day{border:0;background:none;border-radius:12px;min-height:44px;padding:6px 0 5px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;
  font:700 14px/1 var(--font);color:var(--text)}
.cal-day.out{visibility:hidden}
.cal-day.today{box-shadow:inset 0 0 0 1.5px var(--brand)}
.cal-day.sel{background:var(--text);color:var(--bg)}
.dots{display:flex;gap:3px;height:6px;align-items:center}
.dots i{width:6px;height:6px;border-radius:50%;display:block}
.d-mine{background:var(--text-2)} .d-ours{background:var(--brand)} .d-busy{box-shadow:inset 0 0 0 1.5px var(--text-2)} .d-hot{background:var(--danger)}
.cal-day.sel .d-mine{background:var(--bg)} .cal-day.sel .d-busy{box-shadow:inset 0 0 0 1.5px var(--bg)}
.legend{display:flex;gap:var(--s3);flex-wrap:wrap;justify-content:center;font:600 12px/1 var(--font);color:var(--text-2);margin-top:var(--s3)}
.legend span{display:flex;align-items:center;gap:5px}
.day-label{font:800 17px/1.2 var(--font);margin:var(--s5) 0 var(--s3);display:flex;align-items:baseline;gap:var(--s2)}
.day-label small{font:var(--t-caption);color:var(--text-2)}

/* ============ states ============ */
.state{text-align:center;padding:var(--s8) var(--s6);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);margin-top:var(--s4)}
.state .badge{width:56px;height:56px;border-radius:50%;background:var(--surface-2);color:var(--text-2);display:grid;place-items:center;margin:0 auto var(--s3)}
.state .badge .ic{width:26px;height:26px}
.state.err .badge{background:var(--danger-soft);color:var(--danger-ink)}
.state h3{font:800 17px/1.3 var(--font);margin:0 0 6px}
.state p{margin:0 auto;max-width:300px;font:500 14px/1.45 var(--font);color:var(--text-2)}
/* first run: a warm picture, one main action and three ideas that only fill the field */
.welcome{text-align:center;padding:var(--s5) var(--s4) var(--s4);margin-top:var(--s4);border-radius:var(--r-xl);
  background:linear-gradient(180deg,var(--brand-soft),var(--surface) 70%);border:1px solid var(--border)}
.welcome .hero{width:min(220px,70%);height:auto;display:block;margin:0 auto var(--s2)}
.welcome h3{font:800 19px/1.25 var(--font);margin:0 0 6px}
.welcome p.slogan{font:700 14px/1.4 var(--font);color:var(--brand-ink);margin-bottom:var(--s2)}
.welcome p{margin:0 auto var(--s4);max-width:300px;font:500 14px/1.45 var(--font);color:var(--text-2)}
.ideas{display:flex;flex-wrap:wrap;justify-content:center;gap:var(--s2);margin-top:var(--s4)}
.ideas small{width:100%;font:var(--t-caption);color:var(--text-2)}
.ideas button{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:var(--r-full);
  font:600 14px/1.2 var(--font);min-height:40px;padding:0 var(--s3);cursor:pointer;max-width:100%}
.state .btn{margin-top:var(--s4)}
.state.small{padding:var(--s5) var(--s4);margin-top:0}
.skel{height:68px;border-radius:var(--r-l);background:var(--surface);border:1px solid var(--border);margin-bottom:var(--s2);position:relative;overflow:hidden}
.skel::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,var(--surface-2),transparent);animation:shim 1.2s infinite;transform:translateX(-100%)}
.skel.line{height:16px;width:55%;border-radius:8px;border:0;margin:var(--s5) 0 var(--s2)}
@keyframes shim{to{transform:translateX(100%)}}

/* ============ composer: a block under the list, never over it ============ */
.composer{flex:none;padding:var(--s2) var(--s4) max(var(--s2), var(--safe-bottom));background:var(--bg);
  border-top:1px solid var(--border)}
.kb-open .composer{padding-bottom:var(--s2)}  /* the home-indicator inset sits under the keyboard */
.composer form{display:flex;gap:var(--s2);align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-l);
  padding:3px 3px 3px var(--s4)}
.composer form:focus-within{border-color:var(--brand)}
.composer input{flex:1;min-width:0;border:0;background:none;color:var(--text);font:500 16px/1.3 var(--font);outline:none;min-height:40px}
.composer input::placeholder{color:var(--text-3);opacity:1;font-weight:500}
.composer .add{width:44px;height:44px;border-radius:13px;border:0;background:var(--brand-fill);color:var(--on-brand);display:grid;place-items:center;cursor:pointer;flex:none;
  transition:transform var(--fast) var(--ease)}
.composer .add:active{transform:scale(.92)}
.composer .add .ic{width:22px;height:22px;stroke-width:2.4}
.composer .add[disabled]{opacity:.55;cursor:default}
.composer .add .spin{display:none;width:20px;height:20px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:rot .7s linear infinite}
.composer.busy .add .spin{display:block} .composer.busy .add .ic{display:none}
@keyframes rot{to{transform:rotate(360deg)}}
/* plain text, not a button: voice works in the chat with the bot */
.hint{margin:5px 2px 0;font:500 12px/1.3 var(--font);color:var(--text-2)}
.composer:focus-within .hint,.kb-open .hint{display:none}
@media (max-height:600px){ .hint{display:none} }

/* ============ sheet & toast ============ */
.sheet{position:fixed;inset:0;z-index:6;background:var(--scrim);display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity var(--base)}
.sheet.on{opacity:1;pointer-events:auto}
.sheet > div{width:100%;background:var(--surface);border-radius:var(--r-xl) var(--r-xl) 0 0;padding:10px var(--s4) calc(var(--s4) + var(--safe-bottom));
  transform:translateY(100%);transition:transform var(--base) var(--ease);max-height:85vh;overflow:auto}
.sheet.on > div{transform:none}
.grab{width:36px;height:4px;border-radius:2px;background:var(--border);margin:0 auto var(--s3)}
.sheet-head{display:flex;gap:var(--s3);align-items:flex-start;padding:0 0 var(--s3);border-bottom:1px solid var(--border);margin-bottom:var(--s1)}
.sheet-head .tile{width:40px;height:40px;border-radius:12px;background:var(--surface-2);color:var(--text-2);display:grid;place-items:center;flex:none}
.sheet-head b{font:800 17px/1.3 var(--font);overflow-wrap:anywhere;display:block}
.sheet-head small{font:var(--t-caption);color:var(--text-2)}
.opt{display:flex;gap:var(--s3);align-items:center;width:100%;min-height:52px;border:0;background:none;text-align:left;font:600 16px/1.2 var(--font);
  padding:0 var(--s1);border-bottom:1px solid var(--border);cursor:pointer;color:var(--text)}
.opt .ic{color:var(--text-2)}
.opt .cur{margin-left:auto;font:var(--t-caption);color:var(--success-ink);display:flex;align-items:center;gap:4px}
.opt .cur .ic{color:var(--success-ink);width:16px;height:16px}
.opt.danger,.opt.danger .ic{color:var(--danger-ink)}
.opt.cancel{justify-content:center;border:0;color:var(--text-2)}
.toast{position:fixed;left:var(--s4);right:var(--s4);top:calc(var(--s3) + var(--safe-top));z-index:9;display:flex;gap:var(--s3);align-items:center;
  background:var(--text);color:var(--bg);border-radius:var(--r-m);padding:var(--s3) var(--s4);font:600 14px/1.4 var(--font);box-shadow:var(--shadow-2);
  transform:translateY(calc(-100% - 40px));transition:transform var(--base) var(--ease)}
.toast.on{transform:none}
.toast .ic{width:18px;height:18px;flex:none}
.toast.bad .ic{color:var(--danger)}
.toast.good .ic{color:var(--success)}
.toast span{flex:1;min-width:0}
.toast .act{border:0;background:none;color:var(--brand);font:800 14px/1 var(--font);min-height:40px;padding:0 var(--s1) 0 var(--s2);cursor:pointer;white-space:nowrap}
.toast:not(.on){pointer-events:none}
/* edit form in the sheet */
.edit{display:grid;gap:var(--s2);padding:var(--s3) 0;border-bottom:1px solid var(--border)}
.edit label{font:var(--t-caption);color:var(--text-2);display:grid;gap:4px}
.edit input{font:500 16px/1.3 var(--font);color:var(--text);background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-s);
  min-height:44px;padding:0 var(--s3);width:100%;min-width:0;color-scheme:light}
.edit input:focus{outline:none;border-color:var(--brand)}
.edit textarea,.edit select{font:500 16px/1.3 var(--font);color:var(--text);background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-s);
  min-height:44px;padding:var(--s2) var(--s3);width:100%;min-width:0;color-scheme:light dark}
.edit textarea{min-height:72px;resize:vertical}
.emojis{display:flex;flex-wrap:wrap;gap:6px}
.emojis button{width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--surface);font-size:21px;line-height:1;cursor:pointer;padding:0}
.tile.emo{font-size:22px;line-height:1}
.filters{display:flex;gap:6px;overflow-x:auto;padding:2px 0 var(--s2);margin:0 calc(-1 * var(--s1));scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;border:1px solid var(--border);background:var(--surface);color:var(--text-2);font:700 13px/1 var(--font);min-height:36px;padding:0 var(--s3);border-radius:var(--r-full);cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--brand-fill);border-color:transparent;color:#fff}
.tag{display:inline-flex;align-items:center;gap:4px;font:600 12px/1.2 var(--font);color:var(--text-2);margin-top:2px}
.tag .ic{width:13px;height:13px}
.pdates{font:var(--t-caption);color:var(--text-2);margin-top:2px}
.stage-add{margin-top:var(--s3)}
.edit .row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--s2)}
.edit .row label:first-child{grid-column:1/-1}
.edit .row.two label:first-child{grid-column:auto}
.edit .err{font:var(--t-caption);color:var(--danger-ink);min-height:0}
.edit .err:empty{display:none}
.edit .btn{width:100%}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
</style>

  const theme = () => {

  // On phones the app goes full screen (Telegram 8.0+): no grey system bar with the bot name on top, our own
  // header instead. Telegram keeps its close and ⋯ buttons, so the content starts below them (safe areas).
  const insets = () => {
    const a = tg.safeAreaInset || {}, c = tg.contentSafeAreaInset || {}, root = document.documentElement.style;
    root.setProperty("--inset-top", (tg.isFullscreen ? (a.top || 0) + (c.top || 0) : 0) + "px");
    root.setProperty("--inset-bottom", (tg.isFullscreen ? (a.bottom || 0) + (c.bottom || 0) : 0) + "px");
  };
  if (tg.onEvent) ["safeAreaChanged", "contentSafeAreaChanged", "fullscreenChanged"].forEach(ev => tg.onEvent(ev, insets));
  const phone = /^(ios|android)/.test(tg.platform || "");
  if (phone && tg.requestFullscreen && tg.isVersionAtLeast && tg.isVersionAtLeast("8.0")) { try { tg.requestFullscreen(); } catch(e){} }
  insets();
}

class ApiError extends Error { constructor(msg, status){ super(msg); this.status = status; } }
async function api(path, opts={}){
  if (DEMO) return demoApi(path, opts);
  let r;
  const auth = initData ? {"X-Init-Data": initData} : {"Authorization": "Bearer " + store.get("token")};
  try { r = await fetch(path, {...opts, headers:{"Content-Type":"application/json", ...auth}}); }
  catch(e){ throw new ApiError("Нет связи с сервером. Проверьте интернет.", 0); }
  const data = await r.json().catch(() => ({}));
  if (r.status === 401 && !initData) { store.set("token", ""); showLogin(); throw new ApiError("Войдите снова", 401); }
  if (!r.ok) throw new ApiError(data.error || "Сервер ответил ошибкой. Попробуйте ещё раз.", r.status);
  return data;
}
function demoApi(path, opts){
  if (path === "/api/state") return S || demoState();
  if (path.startsWith("/api/chat")) return opts.method === "POST" ? {message:{id:Date.now(), author:1, text:JSON.parse(opts.body).text, at:new Date().toISOString().slice(0, 16).replace("T", " ")}} : {messages:[]};
  if (path === "/api/season") return {current:S.score, last:null, history:[], streak:0, achievements:[], rules:["Пример: в демо-режиме очков нет."],
                                      nudge_mode:"humor", nudge_modes:{humor:"С юмором", soft:"Мягко", min:"Минимум", off:"Выключены"}};
  const m = path.match(/\/api\/items\/(\d+)/);
  if (m && opts.method === "DELETE" || m && path.endsWith("/done")) S.items = S.items.filter(i => i.id != m[1]);
  if (m && path.endsWith("/who")) { const it = S.items.find(i => i.id == m[1]), w = JSON.parse(opts.body).who;
    it.assignee = w === "both" ? null : w === "me" ? 1 : 2; it.assignee_name = w === "both" ? "оба" : w === "me" ? "Лена" : "Артём"; }
  if (m && opts.method === "PATCH") { const it = S.items.find(i => i.id == m[1]); Object.assign(it, JSON.parse(opts.body)); return {item: it}; }
  if (path === "/api/add") {
    const text = JSON.parse(opts.body).text, buy = /^купи/i.test(text);
    const it = {id:Date.now(),kind:buy?"buy":"task",text:buy?text.replace(/^купи(ть)?\s*/i,""):text,assignee:2,assignee_name:"Артём",author:1,when:"",warnings:[]};
    S.items.unshift(it); return {items:[it]};
  }
  return {ok:true};
}

function toast(text, mood = "", ms = 4000, action = null){
  const t = $("toast"), ic = mood === "bad" ? "i-alert" : mood === "good" ? "i-check" : "i-logo";
  t.className = "toast " + mood; t.innerHTML = icon(ic) + `<span>${esc(text)}</span>` + (action ? `<button class="act">${esc(action.label)}</button>` : "");
  if (action) t.querySelector(".act").onclick = () => { t.classList.remove("on"); action.run(); };
  requestAnimationFrame(() => t.classList.add("on"));
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), ms);
}

async function startLogin(){
  let r;
  try { r = await (await fetch("/auth/start", {method:"POST"})).json(); }
  catch(e){ return toast("Нет связи с сервером. Проверьте интернет.", "bad"); }
  // the app's web view hands t.me to the system, which opens Telegram itself
  if (!window.open(r.link, "_blank")) location.href = r.link;
  $("list").innerHTML = stateHtml("i-clock", "Ждём подтверждения в Telegram",
    "Нажмите «Запустить» в чате с ботом и вернитесь сюда.", `<button class="btn ghost" data-login="1">Открыть Telegram ещё раз</button>`);
  const until = Date.now() + r.ttl * 1000;
  clearInterval(loginTimer);
  loginTimer = setInterval(async () => {
    if (Date.now() > until) { clearInterval(loginTimer); return showLogin(); }
    try {
      const p = await (await fetch("/auth/poll?code=" + encodeURIComponent(r.code))).json();
      if (p.token) { clearInterval(loginTimer); store.set("token", p.token); load(true); }
    } catch(e){}
  }, 2000);
}

async function load(first){
  if (first) showLoading();
  if (!initData && !DEMO && !store.get("token")) return showLogin();
  try { S = await api("/api/state"); }
  catch(e){ if (first || !S) return showFatal(e); return toast(e.message, "bad"); }
  if (openProject) await reloadProject();
  $("tabs").hidden = false; $("composer").hidden = false;
  render();
}

// ---------- header ----------
const initial = n => esc((n || "?").trim().charAt(0).toUpperCase());
// "Today" is the bot's calendar day (its time zone), so the app and the reminders agree even if the phone is elsewhere.
const todayIso = () => (S && S.today) || iso(new Date());
const weekday = dayIso => (new Date(dayIso + "T12:00").getDay() + 6) % 7;
function onDay(dayIso){
  const wd = weekday(dayIso);
  return S.items.filter(i => i.kind !== "buy" && (i.day === dayIso || ((i.kind === "busy" || i.kind === "task") && i.weekday === wd)));
}
const shortDate = dayIso => new Date(dayIso + "T12:00").toLocaleDateString("ru-RU", {day:"numeric", month:"short"}).replace(".", "");

function header(){

    `<button class="ava mine" data-myphoto="1" ${photoStyle(me.avatar)} title="${esc(me.name)}" aria-label="Моё фото">${me.avatar ? "" : initial(me.name)}</button>` +

}

// ---------- card ----------
// A person's own photo (set by tapping one's avatar in the header), else the initial on the person's colour.
// The photo is a JPEG data: URL checked by the server (base64 only), so it is safe inside the attribute.
const photoStyle = (photo, color) => photo ? `style="background:center/cover no-repeat url('${photo}')"` : color ? `style="background:var(${color})"` : "";
const photoOf = mine => mine ? S.me.avatar : S.partner && S.partner.avatar;
const avaFor = (name, mine, cls = "") => `<span class="ava ${cls}" ${photoStyle(photoOf(mine), mine ? "--brand-fill" : "--success")}>${photoOf(mine) ? "" : initial(name)}</span>`;
function whoHtml(it){
  if (it.kind === "buy") return "";
  if (it.assignee == null) return `<div class="who">${icon("i-users")}вместе</div>`;
  const mine = it.assignee === S.me.id;
  return `<div class="who">${avaFor(it.assignee_name, mine)}${mine ? "ты" : esc(it.assignee_name)}</div>`;
}
// Burning past its date (red) vs. a promise that has just hung around for a week (amber); both are the server's "hot".
const isLate = it => !!it.hot && !/^висит/.test(it.when || "");
function dueHtml(it){
  if (!it.when) return "";  // no date: nothing is shown rather than an invented one
  const w = it.when;
  if (it.weekday != null && it.kind === "task") return `<div class="due${/^сегодня/.test(w) ? " today" : ""}">${icon("i-repeat")}${esc(w)}</div>`;
  if (isLate(it)) return `<div class="due late">${icon("i-flame")}${esc(w)}</div>`;
  if (it.kind === "event" && it.day && it.day < todayIso()) return `<div class="due past">${icon("i-cal")}${esc(w)}</div>`;
  if (it.repeat && !isLate(it)) return `<div class="due${it.day === todayIso() ? " today" : ""}">${icon(it.repeat === "year" ? "i-gift" : "i-repeat")}${esc(w)}</div>`;
  if (it.day === todayIso()) return `<div class="due today">${icon("i-cal")}${esc(w)}</div>`;
  if (/^висит/.test(w)) return `<div class="due hang">${icon("i-hourglass")}${esc(w)}</div>`;
  if (/^кажд/.test(w)) return `<div class="due">${icon("i-repeat")}${esc(w)}</div>`;
  return `<div class="due">${icon("i-cal")}${esc(w)}</div>`;
}
const clean = w => w.replace(/^⚠️\s*/, "");
// In the card only the first sentence (what clashes with what, and when); the full text is in the sheet.
const lead = w => clean(w).split(/(?<=[»".)])\.?\s+(?=[А-ЯЁ])/)[0].replace(/\.$/, "");
const warnLabel = s => esc(s).replace(/^(Накладка):/, "<b>$1:</b>");
function warnHtml(it){
  return (it.warnings || []).map(w => `<div class="warn">${icon("i-alert")}<span>${warnLabel(lead(w))}. <u data-more="${it.id}">Решить</u></span></div>`).join("");
}
function cardHtml(it){
  const tick = it.kind === "busy" ? "" : `<button class="tick" data-done="${it.id}" aria-label="${it.kind === "buy" ? "Куплено" : "Сделано"}: ${esc(it.text)}"><i>${icon("i-check")}</i></button>`;
  const past = it.kind === "event" && it.day && it.day < todayIso();
  return `<div class="card k-${it.kind}${it.chore_done ? " done" : ""}${it.hot ? " hot" : ""}${isLate(it) ? " late" : ""}${past ? " past" : ""}" id="i${it.id}" data-more="${it.id}">
    ${tileHtml(it)}
    <div class="body"><div class="title">${esc(splitEmoji(it.text)[1])}</div>${dueHtml(it)}${whoHtml(it)}${tagHtml(it)}${warnHtml(it)}</div>${tick}</div>`;
}
// The couple's own emoji in front of a title («🎂 Испечь торт») takes the place of the picture on the card.
const EMOJI_LEAD = /^((?:\p{Extended_Pictographic}|\p{Regional_Indicator})(?:\uFE0F|\u200D(?:\p{Extended_Pictographic})|[\u{1F3FB}-\u{1F3FF}])*)\s*/u;
const splitEmoji = t => { const m = String(t || "").match(EMOJI_LEAD); return m && t.slice(m[0].length).trim() ? [m[1], t.slice(m[0].length)] : ["", t]; };
const tileHtml = it => { const e = splitEmoji(it.text)[0]; return e ? `<span class="tile emo" aria-hidden="true">${esc(e)}</span>` : `<span class="tile">${icon(pic(it))}</span>`; };
const EMOJIS = ["🏠", "🧹", "🛒", "🍳", "🧺", "🔧", "💡", "🚗", "💳", "💊", "🐱", "🐶", "👶", "🎂", "🎁", "❤️", "✈️", "📚", "🏃", "🌱"];
// A project task shown outside its project says which one; a note shows as a mark, its text is in the sheet.
function tagHtml(it){
  const out = [];
  if (it.project && !(tab === "projects" && openProject)) out.push(`<span class="tag">${icon("i-folder")}${esc(it.project)}</span>`);
  if (it.note) out.push(`<span class="tag">${icon("i-list")}заметка</span>`);
  return out.length ? `<div>${out.join(" ")}</div>` : "";
}
function section(title, items, lead = "", cls = "", id = ""){
  if (!items.length) return "";
  return `<div class="sec ${cls}"${id ? ` id="${id}"` : ""}>${lead}<h2>${esc(title)}</h2><span class="count">${items.length}</span></div>` + items.map(cardHtml).join("");
}

const SOON_DAYS = 14;
function homeHtml(){
  const t = todayIso(), me = S.me, wd = weekday(t), soonEnd = iso(addDays(new Date(t + "T12:00"), SOON_DAYS));
  const today = S.items.filter(i => (i.kind === "task" || i.kind === "event") && !i.hot
    && (i.day === t || (i.kind === "task" && i.weekday === wd && !i.chore_done)));

  html += busy.map(b => `<div class="note">${icon("i-clock")}<span>Сегодня ${esc(b.assignee_name)}: ${esc(b.text.toLowerCase())}${b.when ? ", " + esc(b.when) : ""}. Совместное лучше на другой день.</span></div>`).join("");
  html += section("Горит", hot, `<span class="ava both" style="background:var(--danger)">${icon("i-flame")}</span>`, "hot", "sec-hot");

    + projects.slice(0, 4).map(projectRow).join("");

const RESULT = {family:"Победа семьи", chaos:"Победа хаоса", draw:"Ничья"};
// ---------- our chat ----------
// A plain chat for the two of them inside the app; the partner also gets each message in Telegram from the bot.
function chatHtml(){
  const back = `<button class="back" data-back="1">${icon("i-left")}Назад</button>`;
  if (!CHAT.length) return back + stateHtml("i-chat", "Здесь ваш чат", `Пишите друг другу прямо в планере: ${esc(S.partner ? S.partner.name : "партнёр")} увидит сообщение здесь и получит его в Telegram.`);

  for (const m of CHAT) {

    if (day !== last) { html += `<div class="day">${day === todayIso() ? "Сегодня" : esc(shortDate(day))}</div>`; last = day; }
    html += `<div class="msg ${m.author === S.me.id ? "mine" : ""}">${esc(m.text)}<time>${esc(m.at.slice(11, 16))}</time></div>`;

async function pullChat(){
  const after = CHAT.length ? CHAT[CHAT.length - 1].id : 0;
  const r = await api("/api/chat?after=" + after);
  if (r.messages.length) { CHAT = CHAT.concat(r.messages.filter(m => !CHAT.some(c => c.id === m.id))); return true; }
  return false;
}

// Дела: everything to do and plan, by whose it is; project steps live in their projects.
const FILTERS = [["all", "Все"], ["today", "Сегодня"], ["late", "Просрочено"], ["planned", "Запланировано"], ["done", "Выполнено"]];
function doneList(title, items){
  if (!items.length) return "";
  return `<div class="sec past"><h2>${esc(title)}</h2><span class="count">${items.length}</span></div>`
    + items.map(i => `<div class="card done-row"><span class="tile">${icon("i-check")}</span><div class="body"><div class="title">${esc(i.text)}</div>${whoHtml(i)}${tagHtml(i)}</div>
        <button class="undo" data-undo="${i.id}" aria-label="Вернуть: ${esc(i.text)}">Вернуть</button></div>`).join("");
}
function tasksHtml(){
  const me = S.me, p = S.partner, t = todayIso(), wd = weekday(t);
  const items = S.items.filter(i => i.kind === "task" || i.kind === "event" || i.kind === "busy");
  const chips = `<div class="filters" role="group" aria-label="Показать">${FILTERS.map(([k, n]) => `<button data-filter="${k}" aria-pressed="${doFilter === k}">${n}</button>`).join("")}</div>`;
  if (!items.length && !(S.done || []).length) return welcomeHtml(!p);
  const byDay = (a, b) => (a.day || "9") + (a.time || "") < (b.day || "9") + (b.time || "") ? -1 : 1;
  if (doFilter === "done") {
    const done = (S.done || []).filter(i => i.kind === "task");
    return chips + (done.length ? doneList("Выполнено", done) : stateHtml("i-check", "Пока ничего не закрыто", "Сделанные дела появятся здесь, их можно вернуть, если отметили по ошибке."));
  }
  if (doFilter !== "all") {
    const pick = {today: i => !i.hot && (i.day === t || ((i.kind === "task" && !i.chore_done) || i.kind === "busy") && i.weekday === wd),
                  late: i => i.kind === "task" && (i.hot || (i.day && i.day < t && i.weekday == null)),
                  planned: i => i.day && i.day > t}[doFilter];
    const list = items.filter(pick).sort(byDay);
    const empty = {today: ["На сегодня дел нет", "Можно выдохнуть."], late: ["Просроченных нет", "Бытовой хаос в этот раз без очков."],
                   planned: ["Впереди пусто", "Добавьте дело с датой: «оплатить садик до 30.10»."]}[doFilter];
    return chips + (list.length ? list.map(cardHtml).join("") : stateHtml("i-check", empty[0], empty[1]));
  }
  const byHeat = (a, b) => (b.hot ? 1 : 0) - (a.hot ? 1 : 0);
  const todo = items.filter(i => i.kind === "task" && i.weekday == null).sort(byHeat);
  // Занятость here too, so plans and busy time are seen on one screen: today's and upcoming one-offs, then regular.
  const busy = items.filter(i => i.kind === "busy" && (i.weekday != null || !i.day || i.day >= t))
    .sort((a, b) => (a.weekday != null) - (b.weekday != null) || byDay(a, b));
  const chores = items.filter(i => i.kind === "task" && i.weekday != null).sort((a, b) => (a.chore_done ? 1 : 0) - (b.chore_done ? 1 : 0));
  const ev = items.filter(i => i.kind === "event" && i.repeat !== "year"), gone = ev.filter(i => i.day && i.day < t);
  const plans = ev.filter(i => !gone.includes(i)).sort(byDay);
  const dates = items.filter(i => i.repeat === "year").sort((a, b) => a.day < b.day ? -1 : 1);
  return chips + section("Твои дела", todo.filter(i => i.assignee === me.id), avaFor(me.name, true))
       + (p ? section(`Дела: ${p.name}`, todo.filter(i => i.assignee === p.id), avaFor(p.name, false)) : "")
       + section("Общие дела", todo.filter(i => i.assignee == null), `<span class="ava both">${icon("i-users")}</span>`)
       + section("Обязанности по дому", chores, `<span class="ava both">${icon("i-home")}</span>`, "", "sec-chores")
       + section("Ближайшие планы", plans, `<span class="ava both">${icon("i-heart")}</span>`)
       + section("Занятость", busy, `<span class="ava both">${icon("i-clock")}</span>`, "", "sec-busy-tasks")
       + section("Важные даты", dates, `<span class="ava both">${icon("i-gift")}</span>`, "", "sec-dates")
       + section("Прошедшие планы", gone, "", "past");
}

// ---------- calendar ----------
const WD = ["пн", "вт", "ср", "чт", "пт", "сб", "вс"];
const monday = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return x; };
// Shapes as well as colours: filled coral — together, filled grey — personal, ring — someone busy, red — burning.
function dots(list){
  const kinds = new Set(list.map(i => i.hot ? "hot" : i.kind === "busy" ? "busy" : i.assignee == null ? "ours" : "mine"));
  return ["hot", "ours", "mine", "busy"].filter(k => kinds.has(k)).slice(0, 3).map(k => `<i class="d-${k}"></i>`).join("");
}
function dayCell(date, t){
  const key = iso(date), list = onDay(key);
  const label = date.toLocaleDateString("ru-RU", {day:"numeric", month:"long"}) + (list.length ? `, ${list.length} ${plural(list.length, "запись", "записи", "записей")}` : "");
  const cls = [key === t ? "today" : "", key === calDay ? "sel" : ""].join(" ");
  return `<button class="cal-day ${cls}" data-day="${key}" aria-label="${label}"${key === calDay ? ' aria-current="date"' : ""}>${date.getDate()}<span class="dots">${dots(list)}</span></button>`;
}
// Week: one Monday–Sunday strip with its date range. Month: the whole grid. The switch shows which one is on.
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
function weekTitle(mon){
  const sun = addDays(mon, 6), y = sun.getFullYear();
  if (mon.getMonth() === sun.getMonth()) return `${mon.getDate()}–${sun.toLocaleDateString("ru-RU", {day:"numeric", month:"long"})} ${y}`;
  const short = d => d.toLocaleDateString("ru-RU", {day:"numeric", month:"short"}).replace(".", "");
  return `${short(mon)} – ${short(sun)} ${y}`;
}
// After the period changes the selected day follows it: today if it is there, else the first day shown.
function keepDayInView(){
  const t = todayIso(), first = calOpen ? calMonth : calWeek;
  const last = calOpen ? new Date(calMonth.getFullYear(), calMonth.getMonth() + 1, 0) : addDays(calWeek, 6);
  const inside = key => key >= iso(first) && key <= iso(last);
  if (!inside(calDay)) calDay = inside(t) ? t : iso(first);
}
function monthHtml(){
  const t = todayIso(), now = new Date(t + "T12:00");
  if (!calDay) calDay = t;
  if (!calWeek) calWeek = monday(new Date(calDay + "T12:00"));
  if (!calMonth) calMonth = new Date(now.getFullYear(), now.getMonth(), 1);
  let cells = WD.map((w, i) => `<div class="cal-wd${i > 4 ? " we" : ""}">${w}</div>`).join(""), title;
  if (calOpen) {
    const y = calMonth.getFullYear(), m = calMonth.getMonth();
    const first = (new Date(y, m, 1).getDay() + 6) % 7, days = new Date(y, m + 1, 0).getDate();
    for (let i = 0; i < first; i++) cells += `<div class="cal-day out"></div>`;
    for (let d = 1; d <= days; d++) cells += dayCell(new Date(y, m, d), t);
    title = calMonth.toLocaleDateString("ru-RU", {month: "long", year: "numeric"}).replace(" г.", "");
  } else {
    for (let i = 0; i < 7; i++) cells += dayCell(addDays(calWeek, i), t);
    title = weekTitle(calWeek);
  }
  const sel = onDay(calDay);
  const label = new Date(calDay + "T12:00").toLocaleDateString("ru-RU", {weekday: "long", day: "numeric", month: "long"});
  const nothingYet = !S.items.some(i => i.kind !== "buy");
  const list = sel.length ? sel.map(cardHtml).join("")
    : nothingYet && !S.partner
      ? welcomeHtml(true)
      : `<div class="state small"><h3>Свободный день</h3><p>На этот день ничего нет.</p><button class="btn ghost" data-first="1">Добавить план на этот день</button></div>`;
  const unit = calOpen ? "месяц" : "неделя";
  return `<div class="cal"><div class="cal-mode" role="group" aria-label="Показывать">
      <button data-calmode="week" aria-pressed="${!calOpen}">Неделя</button><button data-calmode="month" aria-pressed="${calOpen}">Месяц</button></div>
    <div class="cal-head">
      <button class="nav" data-cal="-1" aria-label="${calOpen ? "Предыдущий месяц" : "Предыдущая неделя"}">${icon("i-left")}</button>
      <div class="cal-title" id="cal-title" aria-live="polite" data-mode="${calOpen ? "month" : "week"}">${esc(title)}</div>
      <button class="nav" data-cal="1" aria-label="${calOpen ? "Следующий месяц" : "Следующая неделя"}">${icon("i-right")}</button></div>
    <div class="cal-grid" data-unit="${unit}">${cells}</div>
    <div class="legend"><span><span class="dots"><i class="d-ours"></i></span>вместе</span><span><span class="dots"><i class="d-mine"></i></span>личное</span><span><span class="dots"><i class="d-busy"></i></span>занят</span><span><span class="dots"><i class="d-hot"></i></span>горит</span></div></div>
    <div class="day-label">${esc(label.charAt(0).toUpperCase() + label.slice(1))} <small>${sel.length ? sel.length + " " + plural(sel.length, "запись", "записи", "записей") : ""}</small></div>${list}${busyHtml()}`;
}
// Занятость lives with the calendar: regular («каждый четверг») and one-off busy time of both, with the same cards.
function busyHtml(){
  const t = todayIso(), me = S.me, p = S.partner;
  const shown = tab === "month" && calDay ? onDay(calDay).map(i => i.id) : [];  // already in the day's list above
  const busy = S.items.filter(i => i.kind === "busy" && (i.weekday != null || !i.day || i.day >= t) && !shown.includes(i.id));
  if (!busy.length && shown.some(id => findItem(id) && findItem(id).kind === "busy")) return "";
  if (!busy.length) return `<div class="note busy-list">${icon("i-clock")}<span>Занятость: напишите «по четвергам у меня футбол» или «в субботу занят с 10 до 14», и вторая половина не запланирует на это время совместное.</span></div>`;
  return `<div class="busy-list">` + section(`Занятость: ${me.name}`, busy.filter(i => i.assignee === me.id), avaFor(me.name, true), "", "sec-busy")
    + (p ? section(`Занятость: ${p.name}`, busy.filter(i => i.assignee === p.id), avaFor(p.name, false)) : "") + `</div>`;
}

    calOpen = mode.dataset.calmode === "month";
    const d = new Date(calDay + "T12:00");  // both views open on the selected day
    if (calOpen) calMonth = new Date(d.getFullYear(), d.getMonth(), 1); else calWeek = monday(d);
    render(); return;
  }
  if (nav) {
    if (calOpen) calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + +nav.dataset.cal, 1);
    else calWeek = addDays(calWeek, 7 * nav.dataset.cal);
    keepDayInView(); render(); return;
  }
  const idea = e.target.closest("[data-idea]");
  if (idea) { const inp = $("input"); inp.value = idea.dataset.idea; store.set("draft", inp.value); inp.focus(); return; }  // fills the field, saves nothing
  const addto = e.target.closest("[data-addto]");
  if (addto) { const inp = $("input"); inp.value = addto.dataset.addto + ": "; inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); return; }
  if (e.target.closest("[data-first]")) {
    // Add through the usual field; for another calendar day the date goes in first («05.11 …»).
    const inp = $("input");
    if (tab === "month" && calDay && calDay !== todayIso() && !inp.value.trim()) inp.value = `${calDay.slice(8, 10)}.${calDay.slice(5, 7)} `;
    inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); return;
  }
  if (day) { calDay = day.dataset.day; render(); return; }
  const d = e.target.closest("[data-done]");
  if (d) {
    const id = +d.dataset.done, el = $("i" + id), it = findItem(id);
    if (el.classList.contains("done")) return;
    ticked = Date.now(); el.classList.add("done"); tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("success");
    let res;
    try { res = await api(`/api/items/${id}/done`, {method:"POST"}); }
    catch(err){ el.classList.remove("done"); toast("Не отметилось: " + err.message, "bad"); return; }
    updateScore(res.score);  // the server's count; a repeated tap gets scored=false and no victory line
    const win = res.scored && res.toast;
    if (it && (it.weekday != null || it.repeat)) {  // a chore or a payment stays: ticked till its next turn, or moved on
      await load();
      const next = S.items.find(i => i.id === id || (it.series || it.id) === i.series && i.id !== id && it.kind === "task");
      toast((win ? win + " " : "") + (it.repeat ? `Следующий раз: ${next ? next.when : ""}` : "Отмечено на эту неделю."), "good", 6000, {label: "Вернуть", run: async () => {
        try { await api(`/api/items/${id}/undo`, {method:"POST"}); toast("Вернул.", "good"); }
        catch(err){ toast("Не вернулось: " + err.message, "bad"); }
        await load();
      }});
      return;
    }
    // The card fades out; «Вернуть» cancels that if it comes first, so the list never drops a restored item.
    // Then the list is fetched again: a project's «N из M» and the history («Выполнено», «Куплено недавно») come from the server.
    const t1 = setTimeout(() => { el.classList.add("gone"); t2 = setTimeout(() => { S.items = S.items.filter(i => i.id !== id); render(); load(); }, 260); }, 500);
    let t2 = 0;
    toast(it && it.kind === "buy" ? "Куплено. Холодильник благодарит." : win || DONE_LINES[id % 3], "good", 6000, {label: "Вернуть", run: async () => {
      clearTimeout(t1); clearTimeout(t2);
      try { await api(`/api/items/${id}/undo`, {method:"POST"}); toast("Вернул в список.", "good"); }
      catch(err){ toast("Не вернулось: " + err.message, "bad"); }
      await load();
    }});
    return;
  }
  const m = e.target.closest("[data-more]");
  if (m) openSheet(findItem(+m.dataset.more));
});

// «Напомнить»: minutes before the due moment; "" = at the time (the default), -1 = never, -2 = every hour that day
// (from the morning till 21:00, until it is done). Days count from the morning.
const REMINDS = [["", "В срок"], ["15", "За 15 минут"], ["60", "За час"], ["180", "За 3 часа"], ["1440", "За день"], ["2880", "За 2 дня"], ["10080", "За неделю"], ["-2", "Каждый час в этот день"], ["-1", "Не напоминать"]];
const REPEATS = [["", "Не повторять"], ["day", "Каждый день"], ["week", "Каждую неделю"], ["month", "Каждый месяц"]];
const repeatKey = it => !it.repeat ? "" : it.repeat.startsWith("month:") ? "month" : it.repeat;
const findItem = id => S.items.find(i => i.id === id) || (P && P.items.find(i => i.id === id)) || (S.done || []).find(i => i.id === id);
// «Моё фото»: the picture is cut to a square and shrunk to 256 px in the phone, only that small JPEG goes to the server.
function photoSheet(){
  const me = S.me;
  $("sheet-body").innerHTML = `<div class="sheet-head"><span class="ava big" ${photoStyle(me.avatar, "--brand-fill")}>${me.avatar ? "" : initial(me.name)}</span><div><b>Моё фото</b><small>Его увидите вы оба: в шапке и у ваших дел</small></div></div>
    <label class="opt" for="photo-file">${icon("i-user")}<span>${me.avatar ? "Поменять фото" : "Выбрать фото"}</span></label>
    <input type="file" id="photo-file" accept="image/*" hidden>
    ${me.avatar ? `<button class="opt danger" data-nophoto="1">${icon("i-trash")}<span>Убрать фото</span></button>` : ""}
    ${!initData && store.get("token") ? `<button class="opt" data-logout="1">${icon("i-left")}<span>Выйти из аккаунта на этом телефоне</span></button>` : ""}
    <button class="opt cancel" data-close="1">Отмена</button>`;
  openSheetEl();
  $("photo-file").onchange = async () => {
    const f = $("photo-file").files[0]; if (!f) return;
    let data;
    try { data = await squareJpeg(f, 256); } catch(e){ return toast("Не получилось открыть эту картинку. Попробуйте другую.", "bad"); }
    try { me.avatar = (await api("/api/avatar", {method:"POST", body:JSON.stringify({image:data})})).avatar; }
    catch(err){ return toast("Не сохранилось: " + err.message, "bad"); }
    closeSheet(); toast("Фото сохранено. Партнёр увидит его при следующем обновлении.", "good"); render();
  };
  $("sheet").onclick = async e => {
    const b = e.target.closest("button");
    if (e.target === $("sheet") || (b && b.dataset.close)) return closeSheet();
    if (b && b.dataset.logout) {
      try { await fetch("/auth/logout", {method:"POST", headers:{"Authorization": "Bearer " + store.get("token")}}); } catch(err){}
      store.set("token", ""); closeSheet(); S = null; return showLogin();
    }
    if (b && b.dataset.nophoto) {
      try { await api("/api/avatar", {method:"POST", body:JSON.stringify({image:null})}); me.avatar = null; }
      catch(err){ return toast("Не сохранилось: " + err.message, "bad"); }
      closeSheet(); toast("Фото убрано.", "good"); render();
    }

}
function squareJpeg(file, size){
  return new Promise((ok, fail) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const side = Math.min(img.naturalWidth, img.naturalHeight), c = document.createElement("canvas");
      c.width = c.height = size;
      c.getContext("2d").drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, size, size);
      URL.revokeObjectURL(url);
      let q = 0.85, out = c.toDataURL("image/jpeg", q);
      while (out.length > 50000 && q > 0.4) { q -= 0.15; out = c.toDataURL("image/jpeg", q); }  // stays under the server's 40 KB
      ok(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); fail(new Error("bad image")); };
    img.src = url;
  });
}
function closeSheet(){ $("sheet").classList.remove("on"); $("sheet").setAttribute("aria-hidden", "true"); syncBack(); }
function openSheetEl(){ $("sheet").classList.add("on"); $("sheet").setAttribute("aria-hidden", "false"); syncBack(); }
// Telegram's own «Назад» (the header arrow, Android's back key): closes the sheet, then leaves a project or the season,
// instead of closing the whole app. Hidden on the top-level screens, where back means leaving.
function syncBack(){
  const bb = tg && tg.BackButton; if (!bb) return;
  ($("sheet").classList.contains("on") || openProject || openSeason || openChat) ? bb.show() : bb.hide();
}
function goBack(){
  if ($("sheet").classList.contains("on")) return closeSheet();
  if (openChat) { closeChat(); return render(); }
  if (openProject || openSeason) { openProject = null; P = null; openSeason = false; render(); }
}
if (tg && tg.BackButton && tg.BackButton.onClick) tg.BackButton.onClick(goBack);
function openSheet(it){
  if (!it) return;
  const rows = [], cur = it.assignee == null ? "both" : it.assignee === S.me.id ? "me" : "partner";
  const mark = w => w === cur ? `<span class="cur">${icon("i-check")}сейчас</span>` : "";
  if (it.kind === "task" || it.kind === "event") {
    rows.push(`<button class="opt" data-who="me">${icon("i-user")}<span>Это на мне</span>${mark("me")}</button>`);
    if (S.partner) rows.push(`<button class="opt" data-who="partner">${icon("i-send")}<span>Передать: ${esc(S.partner.name)}</span>${mark("partner")}</button>`);
    rows.push(`<button class="opt" data-who="both">${icon("i-users")}<span>Делаем вместе</span>${mark("both")}</button>`);
  }
  if (it.kind === "task" && it.project_id) rows.push(`<button class="opt" data-toproj="none">${icon("i-folder")}<span>Убрать из проекта «${esc(it.project || "")}»</span></button>`);
  else if (it.kind === "task") (S.projects || []).slice(0, 5).forEach(pr => rows.push(`<button class="opt" data-toproj="${pr.id}">${icon("i-folder")}<span>В проект «${esc(pr.name)}»</span></button>`));
  if (it.project_id && it.status === "open" && tab === "projects" && openProject) rows.push(
    `<button class="opt" data-move="-1">${icon("i-left")}<span>Выше в списке</span></button><button class="opt" data-move="1">${icon("i-right")}<span>Ниже в списке</span></button>`);
  if (it.day && (it.warnings || []).length) rows.push(`<button class="opt" data-openday="${it.day}">${icon("i-cal")}<span>Открыть этот день в календаре</span></button>`);
  rows.push(`<button class="opt" data-edit="1">${icon("p-tool")}<span>${it.kind === "buy" || it.weekday != null ? "Изменить название" : "Изменить: срок, заметка, напоминание, повтор"}</span></button>`);
  rows.push(`<button class="opt danger" data-del="1">${icon("i-trash")}<span>Удалить</span></button><button class="opt cancel" data-close="1">Отмена</button>`);
  const sub = [it.when, (it.warnings || []).length ? "есть накладка" : ""].filter(Boolean).join(" · ");
  const dated = it.kind !== "buy" && it.weekday == null;
  const form = `<form class="edit" id="edit" hidden>
      <label>Название<input name="text" maxlength="300" value="${esc(it.text)}" autocomplete="off"></label>
      <div class="emojis" role="group" aria-label="Эмодзи в начале названия">${EMOJIS.map(e => `<button type="button" data-emoji="${e}">${e}</button>`).join("")}<button type="button" data-emoji="" aria-label="Без эмодзи">✕</button></div>
      ${dated ? `<div class="row"><label>Дата<input type="date" name="day" value="${esc(it.day || "")}"></label><label>С<input type="time" name="time" value="${esc(it.time || "")}"></label><label>До<input type="time" name="end" value="${esc(it.end || "")}"></label></div>
      <div class="row two"><label>Напомнить<select name="remind">${REMINDS.map(([v, n]) => `<option value="${v}"${String(it.remind ?? "") === v ? " selected" : ""}>${n}</option>`).join("")}</select></label>
        ${it.repeat === "year" ? "" : `<label>Повтор<select name="repeat">${REPEATS.map(([v, n]) => `<option value="${v}"${repeatKey(it) === v ? " selected" : ""}>${n}</option>`).join("")}</select></label>`}</div>` : ""}
      ${it.kind === "task" && it.project_id && P && P.sections.length ? `<label>Этап<select name="section"><option value="">Без этапа</option>${P.sections.map(sc => `<option value="${sc.id}"${it.section_id === sc.id ? " selected" : ""}>${esc(sc.name)}</option>`).join("")}</select></label>` : ""}
      ${it.kind !== "buy" ? `<label>Заметка<textarea name="note" maxlength="2000" placeholder="Детали, ссылки, размеры…">${esc(it.note || "")}</textarea></label>` : ""}
      <div class="err" id="edit-err" role="alert"></div>
      <button class="btn" type="submit">Сохранить</button></form>`;
  $("sheet-body").innerHTML = `<div class="sheet-head">${tileHtml(it)}<div><b>${esc(splitEmoji(it.text)[1])}</b>${sub ? `<small>${esc(sub)}</small>` : ""}</div></div>`
    + (it.warnings || []).map(w => `<div class="warn" style="margin:var(--s2) 0">${icon("i-alert")}<span>${warnLabel(clean(w))}</span></div>`).join("")
    + form + rows.join("");
  $("edit").querySelector(".emojis").onclick = e => {  // puts the chosen emoji in front of the title, or takes it off
    const b = e.target.closest("[data-emoji]"); if (!b) return;
    const inp = $("edit").text, rest = splitEmoji(inp.value)[1].trim();
    inp.value = b.dataset.emoji ? `${b.dataset.emoji} ${rest}` : rest;
  };
  $("edit").onsubmit = async e => {
    e.preventDefault();
    const f = new FormData($("edit")), body = {text: f.get("text")};
    if (dated) { body.day = f.get("day") || null; body.time = f.get("time") || null; body.end = f.get("end") || null;
                 body.remind = f.get("remind") === "" ? null : +f.get("remind");
                 if (f.has("repeat") && f.get("repeat") !== repeatKey(it)) body.repeat = f.get("repeat") || null; }
    if (f.has("note")) body.note = f.get("note");
    if (f.has("section")) body.section = f.get("section") ? +f.get("section") : null;
    const btn = $("edit").querySelector(".btn"); if (btn.disabled) return;
    btn.disabled = true; $("edit-err").textContent = "";
    try { await api(`/api/items/${it.id}`, {method:"PATCH", body:JSON.stringify(body)}); }
    catch(err){ $("edit-err").textContent = err.message; btn.disabled = false; return; }
    toast("Исправлено.", "good"); closeSheet(); await load();
  };
  openSheetEl();
  $("sheet").onclick = async e => {
    const b = e.target.closest("button");
    if (e.target === $("sheet") || (b && b.dataset.close)) return closeSheet();
    if (!b || b.closest(".edit")) return;
    if (b.dataset.edit) { $("edit").hidden = false; b.hidden = true; $("edit").querySelector("input").focus(); return; }
    if (b.dataset.openday) {
      closeSheet(); tab = "month"; calDay = b.dataset.openday; calWeek = monday(new Date(calDay + "T12:00")); calOpen = false;
      render(); $("tabs").scrollIntoView({block:"start"}); return;
    }
    if (b.dataset.del && !b.dataset.sure) { b.dataset.sure = "1"; b.querySelector("span").textContent = "Точно удалить? Нажмите ещё раз"; return; }
    try {
      if (b.dataset.del) { await api(`/api/items/${it.id}`, {method:"DELETE"}); toast("Удалено.", "good"); }
      if (b.dataset.move) { await api(`/api/items/${it.id}/move`, {method:"POST", body:JSON.stringify({dir: +b.dataset.move})}); }
      if (b.dataset.toproj) { await api(`/api/items/${it.id}`, {method:"PATCH", body:JSON.stringify({project_id: b.dataset.toproj === "none" ? null : +b.dataset.toproj})}); toast(b.dataset.toproj === "none" ? "Убрано из проекта, задача осталась в «Делах»." : "Перенесено в проект.", "good"); }
      if (b.dataset.who) { await api(`/api/items/${it.id}/who`, {method:"POST", body:JSON.stringify({who:b.dataset.who})}); toast(b.dataset.who === "partner" ? "Передано. Без обид." : "Готово, переназначено.", "good"); }
    } catch(err){ toast("Не сохранилось: " + err.message, "bad"); }
    closeSheet();
    await load();
  };
}
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

// The draft survives an accidental close or a failed save.
$("input").value = store.get("draft");
$("input").oninput = () => store.set("draft", $("input").value);
let sending = false;  // one request at a time: a double tap or Enter+tap must not save the line twice
$("form").onsubmit = async e => {
  e.preventDefault();
  if (sending) return;
  const text = $("input").value.trim(); if (!text) return $("input").focus();
  sending = true; $("add").disabled = true; $("composer").classList.add("busy"); $("form").setAttribute("aria-busy", "true");
  try {
    if (openChat) {
      const r = await api("/api/chat", {method:"POST", body:JSON.stringify({text})});
      $("input").value = ""; store.set("draft", "");
      if (!CHAT.some(m => m.id === r.message.id)) CHAT.push(r.message);
      render(); $("input").focus(); return;
    }
    if (tab === "projects" && openProject) {  // inside a project the line is its next step, whatever it says
      const r = await api(`/api/projects/${openProject}/items`, {method:"POST", body:JSON.stringify({text, who:"me", section: addSection})});
      $("input").value = ""; store.set("draft", "");
      P = r.project; toast("Задача добавлена. Срок, человек и напоминание: нажмите на неё.", "good");
      await load(); return;
    }
    const r = await api("/api/add", {method:"POST", body:JSON.stringify({text})});
    $("input").value = ""; store.set("draft", "");
    const it = r.items[0];
    // Stay where the line belongs: shopping in «Покупки», busy time in the calendar, project steps in their project.
    if (it.project_id) { await load(); toast(`Записал в проект «${it.project}»`, "good"); return showProject(it.project_id); }
    tab = it.kind === "buy" ? "buy" : it.kind === "busy" && tab !== "tasks" ? "month" : tab === "home" || tab === "projects" ? "home" : tab === "month" ? "month" : "tasks";
    const warn = r.items.flatMap(i => i.warnings || []);
    if (warn.length) toast(clean(warn[0]), "bad", 7000);
    else if (r.items.every(i => i.existing)) toast(`Уже в списке: ${r.items.map(i => i.text).join(", ")}`, "good");
    else toast(`Записал: ${r.items.filter(i => !i.existing).map(i => i.text).join(", ")}`, "good");
    // A filter that would hide what was just added («Сегодня» and a task for tomorrow) gives way, so it is seen.
    if (tab === "tasks" && doFilter !== "all") doFilter = "all";
    await load();
    r.items.forEach(i => { const el = $("i" + i.id); if (el) { el.classList.add("fresh"); el.scrollIntoView({block:"nearest", behavior: smooth()}); } });
  } catch(err){ toast(err.status === 400 ? err.message : "Не сохранилось: " + err.message + " Текст остался в поле.", "bad", 6000); }
  finally { sending = false; $("add").disabled = false; $("composer").classList.remove("busy"); $("form").removeAttribute("aria-busy"); }
};

// The shell is exactly as tall as what is visible: the on-screen keyboard (iOS keeps the page under it, Android
// resizes) and Telegram's half-open sheet both shrink the list area, and the composer stays right above.
function fit(){
  const vv = window.visualViewport, h = vv ? vv.height : innerHeight;
  const root = document.documentElement.style;
  root.setProperty("--app-h", Math.round(h) + "px");
  root.setProperty("--app-top", Math.round(vv ? vv.offsetTop : 0) + "px");
  document.body.classList.toggle("kb-open", innerHeight - h > 120 || (!!tg && tg.viewportStableHeight > 0 && tg.viewportStableHeight - h > 120));
}
fit();
if (window.visualViewport) { visualViewport.addEventListener("resize", fit); visualViewport.addEventListener("scroll", fit); }
window.addEventListener("resize", fit);
if (tg && tg.onEvent) tg.onEvent("viewportChanged", fit);
// iOS scrolls the whole page to reveal a focused field; the shell already moved, so put the page back.
$("input").addEventListener("focus", () => setTimeout(() => { window.scrollTo(0, 0); fit(); }, 50));
window.addEventListener("online", () => S || load(true));
// Sync between the two phones: re-read the state when the app comes back to the screen and every 20 s while it is
// open, and redraw only if something changed. Never while a sheet is open, a line is being sent or a tick can be undone.
let lastState = "", ticked = 0;
async function refresh(){
  // The field keeps its text and focus: only the list is redrawn.
  if (!S || sending || document.hidden || $("sheet").classList.contains("on") || Date.now() - ticked < 7000) return;  // a tick's «Вернуть» is still on screen
  try {
    const next = await api("/api/state"), was = P ? JSON.stringify(P) : "";
    if (openProject) await reloadProject();
    if (openSeason) SEASON = await api("/api/season");
    const key = JSON.stringify(next) + (P ? JSON.stringify(P) : "");
    if (key === lastState && (!P || JSON.stringify(P) === was)) return;
    lastState = key; S = next; render();
  } catch(e){}  // a hiccup on a background refresh is not worth a toast
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
setInterval(refresh, 20000);

load(true);

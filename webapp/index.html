<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Обещал — сделал</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF6F0; --card:#FFFFFF; --ink:#2A2320; --muted:#8C7F77; --line:#EFE5DB;
  --accent:#F0643C; --accent-soft:#FDE6DD; --ok:#3BA776; --ok-soft:#E1F4EA;
  --busy:#7A6CF0; --busy-soft:#ECE9FE; --event:#E0457B; --event-soft:#FCE4EE; --shadow:0 2px 10px rgba(80,50,30,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17130F; --card:#221C18; --ink:#F4ECE6; --muted:#A3958B; --line:#332A24;
    --accent:#FF7A52; --accent-soft:#3A2219; --ok:#4CC08A; --ok-soft:#1B3328;
    --busy:#9C90FF; --busy-soft:#27234A; --event:#FF6A9C; --event-soft:#3D1D2A; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#17130F; --card:#221C18; --ink:#F4ECE6; --muted:#A3958B; --line:#332A24;
  --accent:#FF7A52; --accent-soft:#3A2219; --ok:#4CC08A; --ok-soft:#1B3328;
  --busy:#9C90FF; --busy-soft:#27234A; --event:#FF6A9C; --event-soft:#3D1D2A; --shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.4 Manrope,system-ui,sans-serif;padding:0 16px 120px}
header{padding:20px 0 8px}
.brand{font-weight:800;font-size:22px;letter-spacing:-.3px}
.brand span{color:var(--accent)}
.pair{color:var(--muted);font-size:13px;margin-top:2px}
.invite{background:var(--accent-soft);border-radius:16px;padding:14px;margin:12px 0;display:flex;gap:12px;align-items:center}
.invite p{margin:0;flex:1;font-size:13px}
.btn{border:0;border-radius:12px;background:var(--accent);color:#fff;font:700 14px Manrope,sans-serif;padding:10px 14px;cursor:pointer}
.tabs{display:flex;gap:6px;background:var(--line);padding:4px;border-radius:14px;margin:12px 0 16px;position:sticky;top:8px;z-index:2}
.tabs button{flex:1;border:0;background:none;color:var(--muted);font:700 13px Manrope,sans-serif;padding:9px 4px;border-radius:10px;cursor:pointer}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.tabs b{font-weight:800;color:var(--accent);margin-left:3px}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:18px 4px 8px}
.item{background:var(--card);border-radius:16px;padding:12px 12px 12px 10px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start;box-shadow:var(--shadow);transition:opacity .3s,transform .3s}
.item.gone{opacity:0;transform:translateX(40px)}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;margin-top:1px;cursor:pointer;display:grid;place-items:center;color:transparent;background:none;padding:0}
.check:hover{border-color:var(--ok)}
.item.done .check{background:var(--ok);border-color:var(--ok);color:#fff}
.body{flex:1;min-width:0}
.text{font-weight:600;word-wrap:break-word}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.chip{font-size:12px;font-weight:700;padding:2px 8px;border-radius:8px;background:var(--line);color:var(--muted)}
.chip.when{background:var(--accent-soft);color:var(--accent)}
.chip.busy{background:var(--busy-soft);color:var(--busy)}
.chip.event{background:var(--event-soft);color:var(--event)}
.warn{font-size:12px;color:var(--event);margin-top:6px}
.more{border:0;background:none;color:var(--muted);font-size:20px;line-height:1;padding:0 4px;cursor:pointer}
.empty{text-align:center;color:var(--muted);padding:40px 20px}
.empty .big{font-size:40px}
.composer{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
.composer form{display:flex;gap:8px;background:var(--card);border-radius:18px;padding:6px 6px 6px 14px;box-shadow:0 4px 20px rgba(80,50,30,.12);border:1px solid var(--line)}
.composer input{flex:1;border:0;background:none;color:var(--ink);font:500 15px Manrope,sans-serif;outline:none;min-width:0}
.composer .hint{font-size:11px;color:var(--muted);text-align:center;margin-top:6px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end;z-index:5}
.sheet.on{display:flex}
.sheet div{background:var(--card);width:100%;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink);font:600 16px Manrope,sans-serif;padding:13px 6px;border-bottom:1px solid var(--line);cursor:pointer}
.sheet button.red{color:var(--event)}
.toast{position:fixed;left:16px;right:16px;top:16px;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;font-size:14px;z-index:9;transform:translateY(calc(-100% - 40px));transition:transform .3s}
.toast.on{transform:none}
</style>
</head>
<body>
<header>
  <div class="brand">Обещал <span>—</span> сделал</div>
  <div class="pair" id="pair">Загружаю…</div>
</header>
<div id="invite"></div>
<nav class="tabs" id="tabs">
  <button data-tab="tasks" class="on">Дела<b id="n-tasks"></b></button>
  <button data-tab="buy">Покупки<b id="n-buy"></b></button>
  <button data-tab="busy">Занятые дни</button>
</nav>
<main id="list"></main>
<div class="composer">
  <form id="form"><input id="input" placeholder="Вкрути лампочку до субботы…" autocomplete="off" maxlength="500"><button class="btn">＋</button></form>
  <div class="hint">Голосом удобнее в чате с ботом 🎙</div>
</div>
<div class="sheet" id="sheet"><div id="sheet-body"></div></div>
<div class="toast" id="toast"></div>
<script>
const tg = window.Telegram && Telegram.WebApp;
const initData = tg ? tg.initData : "";
const DEMO = !initData;
let S = null, tab = "tasks";
if (tg) { tg.ready(); tg.expand(); }

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function demoState(){
  return {brand:"Обещал — сделал", me:{id:1,name:"Маша"}, partner:{id:2,name:"Дима"}, invite:"", items:[
    {id:1,kind:"task",text:"Вкрутить лампочку в ванной",assignee:2,assignee_name:"Дима",author:1,when:"висит 14 дней",warnings:[]},
    {id:2,kind:"task",text:"Записать кота к ветеринару",assignee:1,assignee_name:"Маша",author:2,when:"завтра",warnings:[]},
    {id:3,kind:"event",text:"Едем к маме на дачу",assignee:null,assignee_name:"оба",author:1,when:"сб 26.10",
     warnings:["⚠️ Осторожно: сб 26.10 Дима занят(а), там «Баня с друзьями». Планировать на этот день совместное — смелый поступок."]},
    {id:4,kind:"task",text:"Повесить полку в прихожей",assignee:2,assignee_name:"Дима",author:1,when:"вс 27.10 в 12:00",warnings:[]},
    {id:5,kind:"buy",text:"Батарейки AA",assignee:null,assignee_name:"оба",author:1,when:"",warnings:[]},
    {id:6,kind:"buy",text:"Молоко",assignee:null,assignee_name:"оба",author:2,when:"",warnings:[]},
    {id:7,kind:"buy",text:"Корм для кота",assignee:null,assignee_name:"оба",author:1,when:"",warnings:[]},
    {id:8,kind:"busy",text:"Футбол",assignee:2,assignee_name:"Дима",author:2,when:"каждый четверг",warnings:[]},
    {id:9,kind:"busy",text:"Баня с друзьями",assignee:2,assignee_name:"Дима",author:2,when:"сб 26.10",warnings:[]},
    {id:10,kind:"busy",text:"Маникюр",assignee:1,assignee_name:"Маша",author:1,when:"пт 25.10 в 18:00",warnings:[]},
  ]};
}

async function api(path, opts={}){
  if (DEMO) return demoApi(path, opts);
  const r = await fetch(path, {...opts, headers:{"Content-Type":"application/json","X-Init-Data":initData}});
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || "Ошибка сети");
  return data;
}
function demoApi(path, opts){
  if (path === "/api/state") return S || demoState();
  const m = path.match(/\/api\/items\/(\d+)/);
  if (m && opts.method === "DELETE" || m && path.endsWith("/done")) S.items = S.items.filter(i => i.id != m[1]);
  if (path === "/api/add") {
    const text = JSON.parse(opts.body).text, buy = /^купи/i.test(text);
    const it = {id:Date.now(),kind:buy?"buy":"task",text:buy?text.replace(/^купи(ть)?\s*/i,""):text,assignee:2,assignee_name:"Дима",author:1,when:"",warnings:[]};
    S.items.unshift(it); return {items:[it]};
  }
  return {ok:true};
}

function toast(text){ const t=$("toast"); t.textContent=text; t.classList.add("on"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("on"),4500); }

async function load(){
  try { S = await api("/api/state"); } catch(e){ $("pair").textContent = e.message; return; }
  render();
}

function itemHtml(it){
  const chips = [];
  if (it.kind !== "buy") chips.push(`<span class="chip ${it.kind==="busy"?"busy":it.kind==="event"?"event":""}">${esc(it.assignee==null?"вместе":it.assignee===S.me.id?"ты":it.assignee_name)}</span>`);
  if (it.when) chips.push(`<span class="chip when">${esc(it.when)}</span>`);
  const warn = (it.warnings||[]).map(w => `<div class="warn">${esc(w)}</div>`).join("");
  const check = it.kind === "busy" ? "" : `<button class="check" data-done="${it.id}" aria-label="Сделано">✓</button>`;
  return `<div class="item" id="i${it.id}">${check}<div class="body"><div class="text">${esc(it.text)}</div>${chips.length?`<div class="meta">${chips.join("")}</div>`:""}${warn}</div><button class="more" data-more="${it.id}" aria-label="Ещё">⋯</button></div>`;
}

function group(title, items){ return items.length ? `<h3>${esc(title)}</h3>` + items.map(itemHtml).join("") : ""; }

function render(){
  const me = S.me, p = S.partner;
  $("pair").textContent = p ? `${me.name} & ${p.name}` : `${me.name} · ждём вторую половину`;
  $("invite").innerHTML = (!p && S.invite) ? `<div class="invite"><p>Позови партнёра, иначе напоминать будет некому. Бот уже точит сарказм.</p><button class="btn" id="share">Позвать</button></div>` : "";
  if ($("share")) $("share").onclick = () => {
    const url = "https://t.me/share/url?url=" + encodeURIComponent(S.invite) + "&text=" + encodeURIComponent("Давай вести наш семейный планер 😏");
    tg ? tg.openTelegramLink(url) : window.open(url);
  };
  const by = k => S.items.filter(i => k === "tasks" ? (i.kind === "task" || i.kind === "event") : i.kind === k);
  $("n-tasks").textContent = by("tasks").length || "";
  $("n-buy").textContent = by("buy").length || "";
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  const items = by(tab);
  let html;
  if (!items.length) {
    const e = {tasks:["🕊","Дел нет. Подозрительно спокойно.<br>Напишите, что обещали друг другу."],
               buy:["🛒","Список покупок пуст.<br>Холодильник, видимо, тоже скоро будет."],
               busy:["⚽️","Занятых дней нет.<br>Например: «по четвергам у меня футбол»."]}[tab];
    html = `<div class="empty"><div class="big">${e[0]}</div>${e[1]}</div>`;
  } else if (tab === "tasks") {
    html = group("Твои", items.filter(i => i.assignee === me.id))
         + group(p ? `Дела: ${p.name}` : "Партнёра", items.filter(i => p && i.assignee === p.id))
         + group("Общие", items.filter(i => i.assignee == null));
  } else if (tab === "busy") {
    html = group(`${me.name}`, items.filter(i => i.assignee === me.id)) + (p ? group(p.name, items.filter(i => i.assignee === p.id)) : "");
  } else html = items.map(itemHtml).join("");
  $("list").innerHTML = html;
}

$("tabs").onclick = e => { const b = e.target.closest("button"); if (b) { tab = b.dataset.tab; render(); } };

$("list").onclick = async e => {
  const d = e.target.closest("[data-done]"), m = e.target.closest("[data-more]");
  if (d) {
    const id = +d.dataset.done, el = $("i"+id);
    el.classList.add("done"); tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("success");
    try { await api(`/api/items/${id}/done`, {method:"POST"}); } catch(err){ toast(err.message); el.classList.remove("done"); return; }
    setTimeout(() => { el.classList.add("gone"); setTimeout(() => { S.items = S.items.filter(i => i.id !== id); render(); }, 300); }, 400);
    toast(["Готово! Партнёр уже в курсе 😏","Свершилось. Бот удивлён.","Записано в летопись подвигов."][id % 3]);
  }
  if (m) openSheet(S.items.find(i => i.id === +m.dataset.more));
};

function openSheet(it){
  const rows = [];
  if (it.kind === "task" || it.kind === "event") {
    rows.push(`<button data-who="me">👤 Это на мне</button>`);
    if (S.partner) rows.push(`<button data-who="partner">👫 Отдать: ${esc(S.partner.name)}</button>`);
    rows.push(`<button data-who="both">👥 Вместе</button>`);
  }
  rows.push(`<button class="red" data-del="1">🗑 Удалить</button><button data-close="1">Отмена</button>`);
  $("sheet-body").innerHTML = `<h3 style="margin-top:0">${esc(it.text)}</h3>` + rows.join("");
  $("sheet").classList.add("on");
  $("sheet").onclick = async e => {
    const b = e.target.closest("button");
    if (e.target === $("sheet") || (b && b.dataset.close)) return $("sheet").classList.remove("on");
    if (!b) return;
    try {
      if (b.dataset.del) await api(`/api/items/${it.id}`, {method:"DELETE"});
      if (b.dataset.who) await api(`/api/items/${it.id}/who`, {method:"POST", body:JSON.stringify({who:b.dataset.who})});
    } catch(err){ toast(err.message); }
    $("sheet").classList.remove("on");
    await load();
  };
}

$("form").onsubmit = async e => {
  e.preventDefault();
  const text = $("input").value.trim(); if (!text) return;
  $("input").value = "";
  try {
    const r = await api("/api/add", {method:"POST", body:JSON.stringify({text})});
    const it = r.items[0];
    tab = it.kind === "buy" ? "buy" : it.kind === "busy" ? "busy" : "tasks";
    const warn = r.items.flatMap(i => i.warnings || []);
    toast(warn.length ? warn[0] : `Записал: ${r.items.map(i => i.text).join(", ")}`);
  } catch(err){ toast(err.message); $("input").value = text; return; }
  await load();
};

load();
</script>
</body>
</html>

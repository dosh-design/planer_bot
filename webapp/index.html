<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Обещал — сделал</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F0E8; --paper:#FFFDF9; --ink:#2A2521; --muted:#8B8178; --line:#E6DDD1;
  --accent:#9C4A2A; --accent-soft:#F1E3D8; --olive:#5F6B4E; --olive-soft:#E7EADF;
  --plum:#6E4A5E; --plum-soft:#EFE5EA; --slate:#4F6475; --slate-soft:#E3E9EE;
  --hot:#C0392B; --hot-soft:#FBEAE7; --hot-glow:rgba(192,57,43,.16);
  --shadow:0 1px 2px rgba(60,40,20,.05), 0 8px 24px rgba(60,40,20,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#181512; --paper:#221E1A; --ink:#EDE6DD; --muted:#9A8F84; --line:#352F29;
    --accent:#D08A63; --accent-soft:#3A2A20; --olive:#A3B08C; --olive-soft:#2A2E22;
    --plum:#C99BB3; --plum-soft:#35262E; --slate:#95ADC0; --slate-soft:#232C33;
    --hot:#F0645A; --hot-soft:#3A1D1A; --hot-glow:rgba(240,100,90,.22); --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#181512; --paper:#221E1A; --ink:#EDE6DD; --muted:#9A8F84; --line:#352F29;
  --accent:#D08A63; --accent-soft:#3A2A20; --olive:#A3B08C; --olive-soft:#2A2E22;
  --plum:#C99BB3; --plum-soft:#35262E; --slate:#95ADC0; --slate-soft:#232C33;
  --hot:#F0645A; --hot-soft:#3A1D1A; --hot-glow:rgba(240,100,90,.22); --shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 Inter,system-ui,sans-serif;padding:0 20px 130px}
button{font-family:inherit}
.serif{font-family:Lora,Georgia,serif}

header{padding:26px 0 6px}
.date{font-size:12px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
.hello{font-family:Lora,Georgia,serif;font-weight:500;font-size:30px;line-height:1.15;margin:8px 0 14px;letter-spacing:-.3px}
.pair{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.avas{display:flex}
.ava{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;color:var(--paper);border:2px solid var(--bg)}
.ava.me{background:var(--accent)}
.ava.you{background:var(--olive);margin-left:-8px}
.ava.wait{background:var(--line);color:var(--muted);margin-left:-8px}
.oldest{margin:18px 0 0;padding:12px 14px;border-radius:12px;background:var(--paper);border:1px solid var(--line);font-size:14px}
.oldest b{font-weight:600}
.oldest.alarm{background:var(--hot-soft);border:1px solid var(--hot);border-left:4px solid var(--hot);color:var(--ink)}
.oldest.alarm .lbl{color:var(--hot);font-weight:700;text-transform:uppercase;letter-spacing:1px;font-size:12px;display:block;margin-bottom:2px}

.invite{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0;display:flex;gap:12px;align-items:center}
.invite p{margin:0;flex:1;font-size:14px;color:var(--muted)}
.btn{border:0;border-radius:10px;background:var(--ink);color:var(--paper);font-weight:600;font-size:14px;padding:10px 16px;cursor:pointer}

.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin:18px 0 4px;position:sticky;top:0;z-index:2;background:var(--bg);padding-top:8px}
.tabs button{border:0;background:none;color:var(--muted);font-weight:600;font-size:15px;padding:8px 0 12px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-color:var(--ink)}
.tabs b{font-weight:600;color:var(--muted);margin-left:5px;font-size:13px}
.tabs b.hot{color:#fff;background:var(--hot);border-radius:9px;padding:1px 7px}
.tabs b:empty{display:none}

h3{display:flex;align-items:baseline;gap:8px;font-family:Lora,Georgia,serif;font-weight:600;font-size:17px;margin:24px 2px 10px}
h3 small{font-family:Inter,sans-serif;font-weight:500;color:var(--muted);font-size:13px}
h3.hot{color:var(--hot)}

.item{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 14px 14px 16px;margin-bottom:8px;display:flex;gap:14px;align-items:center;
  box-shadow:var(--shadow);transition:opacity .3s,transform .3s;cursor:pointer;position:relative;overflow:hidden}
.item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--kind)}
.k-task{--kind:var(--accent)} .k-event{--kind:var(--plum)} .k-buy{--kind:var(--olive)} .k-busy{--kind:var(--slate)}
.item.gone{opacity:0;transform:translateX(24px)}
.body{flex:1;min-width:0}
.text{font-weight:500;font-size:16px;word-wrap:break-word;line-height:1.3}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;font-size:13px;color:var(--muted)}
.meta span + span::before{content:"·";margin-right:6px}
.meta .when{color:var(--slate)}
.meta .hang{color:var(--accent)}
.meta .late{color:var(--hot);font-weight:700}
.warn{font-size:13px;color:var(--plum);margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--plum-soft)}
.item.hot{background:var(--hot-soft);border-color:var(--hot);animation:alarm 2s ease-in-out infinite}
.item.hot::before{width:5px;background:var(--hot)}
.item.hot .text{color:var(--hot);font-weight:600}
.item.hot .check{border-color:var(--hot)}
@keyframes alarm{0%,100%{box-shadow:0 0 0 0 var(--hot-glow)}50%{box-shadow:0 0 0 6px var(--hot-glow)}}
.check{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--muted);flex:none;cursor:pointer;display:grid;place-items:center;
  color:transparent;background:none;padding:0;font-size:14px;transition:all .2s}
.check:hover{border-color:var(--olive)}
.item.done .check{background:var(--olive);border-color:var(--olive);color:var(--paper)}

.empty{text-align:center;color:var(--muted);padding:44px 24px}
.empty .t{font-family:Lora,Georgia,serif;font-size:19px;color:var(--ink);margin-bottom:6px}

.composer{position:fixed;left:0;right:0;bottom:0;padding:12px 20px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 35%)}
.composer form{display:flex;gap:8px;align-items:center;background:var(--paper);border-radius:14px;padding:6px 6px 6px 16px;border:1px solid var(--line);box-shadow:0 6px 24px rgba(60,40,20,.08)}
.composer input{flex:1;border:0;background:none;color:var(--ink);font:400 15px Inter,sans-serif;outline:none;min-width:0}
.composer input::placeholder{color:var(--muted)}
.composer .btn{width:40px;height:40px;padding:0;font-size:22px;line-height:1;font-weight:400}
.composer .hint{font-size:12px;color:var(--muted);text-align:center;margin-top:7px}

.sheet{position:fixed;inset:0;background:rgba(20,15,10,.4);display:none;align-items:flex-end;z-index:5}
.sheet.on{display:flex}
.sheet > div{background:var(--paper);width:100%;border-radius:18px 18px 0 0;padding:10px 20px calc(18px + env(safe-area-inset-bottom))}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sheet .title{font-family:Lora,Georgia,serif;font-weight:600;font-size:19px;margin:0 0 6px}
.sheet button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink);font-weight:500;font-size:16px;padding:14px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.sheet button:last-child{border:0;color:var(--muted);text-align:center}
.sheet button.red{color:var(--hot)}

.toast{position:fixed;left:20px;right:20px;top:14px;background:var(--ink);color:var(--paper);border-radius:12px;padding:13px 16px;font-size:14px;z-index:9;
  transform:translateY(calc(-100% - 40px));transition:transform .3s ease}
.toast.on{transform:none}
</style>
</head>
<body>
<header>
  <div class="date" id="date"></div>
  <div class="hello" id="hello">Загружаю…</div>
  <div class="pair" id="pair"></div>
  <div id="oldest"></div>
</header>
<div id="invite"></div>
<nav class="tabs" id="tabs">
  <button data-tab="tasks" class="on">Дела<b id="n-tasks"></b></button>
  <button data-tab="buy">Покупки<b id="n-buy"></b></button>
  <button data-tab="busy">Кто занят</button>
</nav>
<main id="list"></main>
<div class="composer">
  <form id="form"><input id="input" placeholder="Вкрути лампочку до субботы…" autocomplete="off" maxlength="500"><button class="btn" aria-label="Добавить">+</button></form>
  <div class="hint">Голосом удобнее: наговорите в чат с ботом</div>
</div>
<div class="sheet" id="sheet"><div><div class="grab"></div><div id="sheet-body"></div></div></div>
<div class="toast" id="toast"></div>
<script>
const tg = window.Telegram && Telegram.WebApp;
const initData = tg ? tg.initData : "";
const DEMO = !initData;
let S = null, tab = "tasks";
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor("bg_color"); } catch(e){} }

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function demoState(){
  return {brand:"Обещал — сделал", me:{id:1,name:"Маша"}, partner:{id:2,name:"Дима"}, invite:"", items:[
    {id:1,kind:"task",text:"Вкрутить лампочку в ванной",assignee:2,assignee_name:"Дима",author:1,when:"висит 14 дней",hot:true,warnings:[]},
    {id:11,kind:"task",text:"Оплатить интернет",assignee:1,assignee_name:"Маша",author:2,when:"просрочено на 2 дня",hot:true,warnings:[]},
    {id:2,kind:"task",text:"Записать кота к ветеринару",assignee:1,assignee_name:"Маша",author:2,when:"завтра",warnings:[]},
    {id:3,kind:"event",text:"Едем к маме на дачу",assignee:null,assignee_name:"оба",author:1,when:"сб 26.10",
     warnings:["⚠️ Осторожно: сб 26.10 Дима занят(а), там «Баня с друзьями». Планировать на этот день совместное — смелый поступок."]},
    {id:4,kind:"task",text:"Повесить полку в прихожей",assignee:2,assignee_name:"Дима",author:1,when:"вс 27.10 в 12:00",warnings:[]},
    {id:5,kind:"buy",text:"Батарейки AA",assignee:null,assignee_name:"оба",author:1,when:"",warnings:[]},
    {id:6,kind:"buy",text:"Молоко",assignee:null,assignee_name:"оба",author:2,when:"",warnings:[]},
    {id:7,kind:"buy",text:"Корм для кота",assignee:null,assignee_name:"оба",author:1,when:"",warnings:[]},
    {id:8,kind:"busy",text:"Футбол",assignee:2,assignee_name:"Дима",author:2,when:"каждый четверг",warnings:[]},
    {id:9,kind:"busy",text:"Баня с друзьями",assignee:2,assignee_name:"Дима",author:2,when:"сб 26.10",warnings:[]},
    {id:10,kind:"busy",text:"Маникюр",assignee:1,assignee_name:"Маша",author:1,when:"пт 25.10 в 18:00",warnings:[]},
  ]};
}

async function api(path, opts={}){
  if (DEMO) return demoApi(path, opts);
  const r = await fetch(path, {...opts, headers:{"Content-Type":"application/json","X-Init-Data":initData}});
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || "Ошибка сети");
  return data;
}
function demoApi(path, opts){
  if (path === "/api/state") return S || demoState();
  const m = path.match(/\/api\/items\/(\d+)/);
  if (m && opts.method === "DELETE" || m && path.endsWith("/done")) S.items = S.items.filter(i => i.id != m[1]);
  if (path === "/api/add") {
    const text = JSON.parse(opts.body).text, buy = /^купи/i.test(text);
    const it = {id:Date.now(),kind:buy?"buy":"task",text:buy?text.replace(/^купи(ть)?\s*/i,""):text,assignee:2,assignee_name:"Дима",author:1,when:"",warnings:[]};
    S.items.unshift(it); return {items:[it]};
  }
  return {ok:true};
}

function toast(text){ const t=$("toast"); t.textContent=text; t.classList.add("on"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("on"),4500); }

async function load(){
  try { S = await api("/api/state"); } catch(e){ $("hello").textContent = e.message; return; }
  render();
}

function greeting(){
  const h = new Date().getHours();
  return h < 5 ? "Доброй ночи" : h < 12 ? "Доброе утро" : h < 18 ? "Добрый день" : "Добрый вечер";
}
const initial = n => esc((n || "?").trim().charAt(0).toUpperCase());

function itemHtml(it){
  const chips = [];
  if (it.kind !== "buy") {
    const who = it.assignee == null ? "вместе" : it.assignee === S.me.id ? "ты" : it.assignee_name;
    chips.push(`<span>${esc(who)}</span>`);
  }
  if (it.when) chips.push(`<span class="${it.hot ? "late" : it.when.startsWith("висит") ? "hang" : "when"}">${esc(it.when)}</span>`);
  const warn = (it.warnings || []).map(w => `<div class="warn">${esc(w)}</div>`).join("");
  const check = it.kind === "busy" ? "" : `<button class="check" data-done="${it.id}" aria-label="Сделано">✓</button>`;
  return `<div class="item k-${it.kind}${it.hot ? " hot" : ""}" id="i${it.id}" data-more="${it.id}">
    <div class="body"><div class="text">${esc(it.text)}</div>${chips.length ? `<div class="meta">${chips.join("")}</div>` : ""}${warn}</div>${check}</div>`;
}

function group(title, items, dot, cls){
  if (!items.length) return "";
  return `<h3 class="${cls || ""}">${esc(title)} <small>${items.length}</small></h3>` + items.map(itemHtml).join("");
}
const dot = () => "";

function render(){
  const me = S.me, p = S.partner;
  $("date").textContent = new Date().toLocaleDateString("ru-RU", {weekday:"long", day:"numeric", month:"long"});
  $("hello").textContent = `${greeting()}, ${me.name}`;
  $("pair").innerHTML = `<span class="avas"><span class="ava me">${initial(me.name)}</span>` +
    (p ? `<span class="ava you">${initial(p.name)}</span></span><span>${esc(me.name)} и ${esc(p.name)}</span>`
       : `<span class="ava wait">?</span></span><span>ждём вторую половину</span>`);
  const hot = S.items.filter(i => i.hot);
  const hanging = S.items.filter(i => i.kind === "task" && /^висит/.test(i.when || ""))
                         .sort((a, b) => parseInt(b.when.slice(6)) - parseInt(a.when.slice(6)))[0];
  $("oldest").innerHTML = hot.length
    ? `<div class="oldest alarm"><span class="lbl">Просрочено: ${hot.length}</span>Дольше всех: <b>${esc(hot[0].text.toLowerCase())}</b>, ${esc(hot[0].when)}</div>`
    : hanging ? `<div class="oldest">Дольше всех ждёт: <b>${esc(hanging.text.toLowerCase())}</b>, ${esc(hanging.when)}</div>` : "";
  $("invite").innerHTML = (!p && S.invite) ? `<div class="invite"><p>Пригласите вторую половину, иначе напоминать будет некому.</p><button class="btn" id="share">Позвать</button></div>` : "";
  if ($("share")) $("share").onclick = () => {
    const url = "https://t.me/share/url?url=" + encodeURIComponent(S.invite) + "&text=" + encodeURIComponent("Давай вести наш семейный планер");
    tg ? tg.openTelegramLink(url) : window.open(url);
  };
  const by = k => S.items.filter(i => k === "tasks" ? (i.kind === "task" || i.kind === "event") : i.kind === k);
  $("n-tasks").textContent = by("tasks").length || "";
  $("n-tasks").classList.toggle("hot", hot.length > 0);
  $("n-buy").textContent = by("buy").length || "";
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  const items = by(tab);
  let html;
  if (!items.length) {
    const e = {tasks:["Дел нет","Подозрительно спокойно. Напишите, что обещали друг другу."],
               buy:["Список пуст","Холодильник, видимо, тоже скоро будет."],
               busy:["Все свободны","Например: «по четвергам у меня футбол»."]}[tab];
    html = `<div class="empty"><div class="t">${e[0]}</div>${e[1]}</div>`;
  } else if (tab === "tasks") {
    const cold = items.filter(i => !i.hot);
    html = group("Просрочено", items.filter(i => i.hot), "", "hot")
         + group("Ваши дела", cold.filter(i => i.assignee === me.id), dot(me.name, "--terra"))
         + (p ? group(`Дела: ${p.name}`, cold.filter(i => i.assignee === p.id), dot(p.name, "--sage")) : "")
         + group("Вместе", cold.filter(i => i.assignee == null));
  } else if (tab === "busy") {
    html = group(me.name, items.filter(i => i.assignee === me.id), dot(me.name, "--terra"))
         + (p ? group(p.name, items.filter(i => i.assignee === p.id), dot(p.name, "--sage")) : "");
  } else html = `<h3>Купить <small>${items.length}</small></h3>` + items.map(itemHtml).join("");
  $("list").innerHTML = html;
}

$("tabs").onclick = e => { const b = e.target.closest("button"); if (b) { tab = b.dataset.tab; render(); } };

$("list").onclick = async e => {
  const d = e.target.closest("[data-done]");
  if (d) {
    const id = +d.dataset.done, el = $("i" + id);
    el.classList.add("done"); tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("success");
    try { await api(`/api/items/${id}/done`, {method:"POST"}); } catch(err){ toast(err.message); el.classList.remove("done"); return; }
    setTimeout(() => { el.classList.add("gone"); setTimeout(() => { S.items = S.items.filter(i => i.id !== id); render(); }, 350); }, 450);
    toast(["Готово. Вторая половина уже в курсе.","Свершилось. Бот удивлён.","Записано в летопись подвигов."][id % 3]);
    return;
  }
  const m = e.target.closest("[data-more]");
  if (m) openSheet(S.items.find(i => i.id === +m.dataset.more));
};

function openSheet(it){
  const rows = [];
  if (it.kind === "task" || it.kind === "event") {
    rows.push(`<button data-who="me">Это на мне</button>`);
    if (S.partner) rows.push(`<button data-who="partner">Передать: ${esc(S.partner.name)}</button>`);
    rows.push(`<button data-who="both">Делаем вместе</button>`);
  }
  rows.push(`<button class="red" data-del="1">Удалить</button><button data-close="1">Отмена</button>`);
  $("sheet-body").innerHTML = `<div class="title">${esc(it.text)}</div>` + rows.join("");
  $("sheet").classList.add("on");
  $("sheet").onclick = async e => {
    const b = e.target.closest("button");
    if (e.target === $("sheet") || (b && b.dataset.close)) return $("sheet").classList.remove("on");
    if (!b) return;
    try {
      if (b.dataset.del) await api(`/api/items/${it.id}`, {method:"DELETE"});
      if (b.dataset.who) await api(`/api/items/${it.id}/who`, {method:"POST", body:JSON.stringify({who:b.dataset.who})});
    } catch(err){ toast(err.message); }
    $("sheet").classList.remove("on");
    await load();
  };
}

$("form").onsubmit = async e => {
  e.preventDefault();
  const text = $("input").value.trim(); if (!text) return;
  $("input").value = "";
  try {
    const r = await api("/api/add", {method:"POST", body:JSON.stringify({text})});
    const it = r.items[0];
    tab = it.kind === "buy" ? "buy" : it.kind === "busy" ? "busy" : "tasks";
    const warn = r.items.flatMap(i => i.warnings || []);
    toast(warn.length ? warn[0] : `Записал: ${r.items.map(i => i.text).join(", ")}`);
  } catch(err){ toast(err.message); $("input").value = text; return; }
  await load();
};

load();
</script>
</body>
</html>

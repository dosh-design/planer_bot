<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Обещал — сделал</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============ design tokens ============ */
:root{
  /* colour, light. Text pairs checked for WCAG AA: --text-2 on --surface 5.2, --danger-ink on --surface 5.5 */
  --bg:#FFF8F0; --surface:#FFFFFF; --surface-2:#FFF1DE;
  --text:#342A25; --text-2:#7A6A5F; --text-3:#A8978A;
  --brand:#EA754A; --brand-fill:#C4502C; --brand-ink:#B94E27; --brand-soft:#FCE6D8; --on-brand:#FFFFFF;
  --danger:#E54848; --danger-ink:#C53030; --danger-soft:#FFF0EE;
  --warning:#E7A93E; --warning-ink:#94620F; --warning-soft:#FFF5D9;
  --success:#65966B; --success-ink:#3F7346; --success-soft:#EAF4E8;
  --border:#F0E2D4; --control:#A08A7A;
  --shadow-1:0 1px 2px rgba(52,42,37,.05);
  --shadow-2:0 10px 30px rgba(52,42,37,.12);
  --scrim:rgba(36,26,20,.42);
  /* type: one family (already used by the app), four weights */
  --font:Nunito,ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
  --t-display:800 26px/1.15 var(--font);
  --t-section:800 20px/1.2 var(--font);
  --t-title:600 16px/1.3 var(--font);
  --t-body:500 15px/1.45 var(--font);
  --t-caption:600 13px/1.35 var(--font);
  --t-micro:700 11px/1.2 var(--font);
  /* space, radius, motion */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px;
  --r-s:10px; --r-m:14px; --r-l:18px; --r-xl:24px; --r-full:999px;
  --ease:cubic-bezier(.2,.8,.2,1); --fast:.16s; --base:.26s;
}
:root[data-theme="dark"]{
  --bg:#1A1512; --surface:#241D19; --surface-2:#2E2520;
  --text:#F4EAE2; --text-2:#B5A397; --text-3:#7E6E63;
  --brand:#F08A62; --brand-fill:#F08A62; --brand-ink:#F5A07E; --brand-soft:#3A2419; --on-brand:#1A1512;
  --danger:#FF6B6B; --danger-ink:#FF8A8A; --danger-soft:#3A1D1D;
  --warning:#F0BC5E; --warning-ink:#F0BC5E; --warning-soft:#36291A;
  --success:#8DBF8F; --success-ink:#A3D0A5; --success-soft:#1E2B20;
  --border:#362C26; --control:#8A786C;
  --shadow-1:none; --shadow-2:0 10px 30px rgba(0,0,0,.45); --scrim:rgba(0,0,0,.55);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1A1512; --surface:#241D19; --surface-2:#2E2520;
    --text:#F4EAE2; --text-2:#B5A397; --text-3:#7E6E63;
    --brand:#F08A62; --brand-fill:#F08A62; --brand-ink:#F5A07E; --brand-soft:#3A2419; --on-brand:#1A1512;
    --danger:#FF6B6B; --danger-ink:#FF8A8A; --danger-soft:#3A1D1D;
    --warning:#F0BC5E; --warning-ink:#F0BC5E; --warning-soft:#36291A;
    --success:#8DBF8F; --success-ink:#A3D0A5; --success-soft:#1E2B20;
    --border:#362C26; --control:#8A786C;
    --shadow-1:none; --shadow-2:0 10px 30px rgba(0,0,0,.45); --scrim:rgba(0,0,0,.55);
  }
}

/* ============ base ============ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--bg);color:var(--text);font:var(--t-body)}
/* App shell: the list scrolls in its own area and the composer sits BELOW it, not on top of it.
   Height follows the visible viewport (keyboard, Telegram's expand), see fit() in the script. */
.app{position:fixed;left:0;right:0;top:var(--app-top,0px);height:var(--app-h,100%);display:flex;flex-direction:column}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  padding:0 var(--s4) var(--s3)}
button{font:inherit;color:inherit}
[hidden]{display:none !important}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* ============ header: who and when, three counters, the next plan ============ */
.top{padding:var(--s3) 0 0}
.bar{display:flex;align-items:center;gap:10px}
.mark{width:36px;height:36px;border-radius:11px;background:var(--brand);color:#fff;display:grid;place-items:center;flex:none}
.mark .ic{width:21px;height:21px;stroke-width:2.1}
.title-block{flex:1;min-width:0}
h1{font:800 21px/1.15 var(--font);letter-spacing:-.4px;margin:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.date{font:var(--t-caption);color:var(--text-2);margin-top:1px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.date::first-letter{text-transform:uppercase}
.pair{display:flex;align-items:center;flex:none}
.ava{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:800 13px/1 var(--font);
  color:#fff;border:2px solid var(--bg);background:var(--brand-fill);flex:none}
.pair .ava + .ava{margin-left:-9px;background:var(--success)}
.ava.wait{background:var(--surface-2);color:var(--text-2);border-style:dashed;border-color:var(--control)}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s2);margin-top:var(--s3)}
.stat{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:44px;padding:0 var(--s3);border-radius:var(--r-m);
  background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-1);cursor:pointer;text-align:left;
  transition:transform var(--fast) var(--ease)}
.stat:active{transform:scale(.97)}
.stat span{font:600 13px/1.2 var(--font);color:var(--text-2);min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.stat b{font:800 18px/1 var(--font);letter-spacing:-.3px}
.stat.muted b{color:var(--text-3)}
/* the only coloured counter: what needs attention; red if something is really overdue */
.stat.hot{background:var(--warning-soft);border-color:transparent}
.stat.hot span,.stat.hot b{color:var(--warning-ink)}
.stat.hot.late{background:var(--danger-soft)}
.stat.hot.late span,.stat.hot.late b{color:var(--danger-ink)}
@media (max-width:360px){ .stat{padding:0 10px} .stat span{font-size:12px} }

.plan{display:flex;align-items:center;gap:var(--s2);width:100%;min-height:44px;margin-top:var(--s2);padding:0 var(--s2) 0 var(--s3);
  border:0;border-radius:var(--r-m);background:var(--brand-soft);color:var(--text);cursor:pointer;text-align:left}
.plan > .ic{color:var(--brand-ink);width:18px;height:18px}
.plan span{flex:1;min-width:0;font:600 14px/1.25 var(--font);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.plan span small{font:var(--t-caption);color:var(--text-2)}
.plan b{color:var(--brand-ink);font-weight:800}
.plan .go{color:var(--text-2);width:16px;height:16px}
@media (max-width:360px){ .plan{padding-top:6px;padding-bottom:6px} .plan span{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical} }
.note{display:flex;gap:var(--s2);align-items:flex-start;font:var(--t-caption);color:var(--text-2);margin-top:var(--s2)}
.note .ic{width:16px;height:16px;margin-top:1px}

.invite{display:flex;gap:var(--s3);align-items:center;background:var(--surface);border:1px dashed var(--control);
  border-radius:var(--r-l);padding:var(--s3) var(--s4);margin-top:var(--s3)}
.invite p{margin:0;flex:1;font:var(--t-caption);color:var(--text-2)}
.invite p b{display:block;font:var(--t-title);color:var(--text);margin-bottom:2px}
.btn{border:0;border-radius:var(--r-m);background:var(--brand-fill);color:var(--on-brand);font:800 14px/1 var(--font);
  padding:0 var(--s4);min-height:44px;cursor:pointer;white-space:nowrap}
.btn.ghost{background:var(--surface-2);color:var(--text)}

/* ============ tabs ============ */
.tabs{position:sticky;top:0;z-index:3;display:flex;gap:2px;padding:4px;margin:var(--s3) 0 var(--s1);
  background:var(--surface-2);border-radius:var(--r-m);box-shadow:0 0 0 6px var(--bg)}
.tabs button{flex:1;min-width:0;border:0;background:none;color:var(--text-2);font:700 13px/1 var(--font);min-height:40px;
  border-radius:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;padding:0 4px;
  transition:background var(--fast),color var(--fast)}
.tabs button .ic{width:17px;height:17px}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow-1)}
/* icons only where the four labels still fit on one line */
@media (max-width:440px){ .tabs button .ic{display:none} }
@media (max-width:350px){ .tabs button{font-size:12px;gap:3px} }

/* ============ sections ============ */
main{animation:in var(--base) var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.sec{display:flex;align-items:center;gap:var(--s2);margin:var(--s5) 0 var(--s2)}
.sec h2{font:800 18px/1.2 var(--font);letter-spacing:-.3px;margin:0;min-width:0;overflow-wrap:anywhere}
.sec .count{font:700 13px/1 var(--font);color:var(--text-2);background:var(--surface-2);border-radius:var(--r-full);padding:4px 8px}
.sec.hot h2{text-transform:uppercase;letter-spacing:.4px;font-size:16px}
.sec.past h2{color:var(--text-2);font-size:16px}
.sec .ava{width:24px;height:24px;font-size:11px;border:0}
.sec .ava.both{background:var(--brand)}
.sec .ava .ic{width:14px;height:14px;stroke-width:2.2}
.calm{display:flex;gap:var(--s3);align-items:center;margin-top:var(--s5);padding:var(--s3) var(--s4);border-radius:var(--r-m);
  background:var(--success-soft);color:var(--success-ink);font:var(--t-caption)}
.calm .ic{width:18px;height:18px}

/* ============ card ============ */
.card{position:relative;display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-l);padding:10px 8px 10px var(--s3);margin-bottom:var(--s2);box-shadow:var(--shadow-1);cursor:pointer;max-height:600px;
  transition:opacity var(--base) var(--ease),transform var(--base) var(--ease),max-height var(--base) var(--ease),margin var(--base),padding var(--base)}
.card .tile{width:36px;height:36px;border-radius:11px;background:var(--surface-2);color:var(--text-2);display:grid;place-items:center;flex:none}
.card.k-event .tile{background:var(--brand-soft);color:var(--brand-ink)}
.card .body{flex:1;min-width:0;padding-top:2px}
.card .title{font:var(--t-title);overflow-wrap:anywhere;hyphens:auto}
.card .due{display:flex;align-items:center;gap:5px;margin-top:2px;font:var(--t-caption);color:var(--text-2)}
.card .due .ic{width:15px;height:15px}
/* One status signal per card: the due line. Red pill = past its date, amber pill = hanging a week+,
   coral text = today, grey = later or already past (joint plans). Border and tile stay neutral. */
.card .due.late,.card .due.hang{width:fit-content;max-width:100%;padding:2px 8px 2px 6px;border-radius:var(--r-full);margin-top:4px}
.card .due.late{color:var(--danger-ink);background:var(--danger-soft)}
.card .due.hang{color:var(--warning-ink);background:var(--warning-soft)}
.card .due.today{color:var(--brand-ink)}
.card .due.past{color:var(--text-3)}
.card .who{display:flex;align-items:center;gap:6px;margin-top:3px;font:500 13px/1.3 var(--font);color:var(--text-2)}
.card .who .ava{width:18px;height:18px;font-size:9px;border:0}
.card .who .ic{width:16px;height:16px}
.card.past{box-shadow:none;background:transparent}
.card.past .title{color:var(--text-2)}
.tick{width:44px;height:44px;margin:-4px 0 -4px 0;border:0;background:none;padding:0;display:grid;place-items:center;cursor:pointer;flex:none}
.tick i{width:28px;height:28px;border-radius:50%;border:1.8px solid var(--control);display:grid;place-items:center;color:transparent;
  transition:all var(--fast) var(--ease)}
.tick .ic{width:16px;height:16px;stroke-width:2.6}
.tick:hover i{border-color:var(--success)}
.card.done{opacity:.6;box-shadow:none}
.card.done .title{text-decoration:line-through;text-decoration-color:var(--text-3);color:var(--text-2)}
.card.done .tick i{background:var(--success);border-color:var(--success);color:#fff;transform:scale(1.08)}
.card.gone{opacity:0;transform:translateX(24px);max-height:0;margin:0;padding-top:0;padding-bottom:0;border-width:0;overflow:hidden}
.card.fresh{animation:pop .6s var(--ease)}
@keyframes pop{0%{transform:scale(.97);background:var(--brand-soft)}100%{transform:none}}
.warn{display:flex;gap:6px;align-items:flex-start;margin-top:6px;padding:6px var(--s2);border-radius:var(--r-s);
  background:var(--warning-soft);color:var(--text);font:500 13px/1.35 var(--font)}
.warn .ic{width:15px;height:15px;color:var(--warning-ink);margin-top:1px}
.warn b{font-weight:800;color:var(--warning-ink)}
.warn u{text-decoration:none;font-weight:800;color:var(--warning-ink);white-space:nowrap}

/* ============ calendar ============ */
.cal{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-l);padding:var(--s2) var(--s2) var(--s3);margin-top:var(--s3);box-shadow:var(--shadow-1)}
.cal-head{display:flex;align-items:center;gap:var(--s1);padding:0 0 var(--s2)}
.cal-head .nav{width:44px;height:44px;border:0;border-radius:12px;background:none;color:var(--text-2);display:grid;place-items:center;cursor:pointer}
.cal-title{flex:1;min-width:0;border:0;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;border-radius:12px}
.cal-title b{font:800 16px/1 var(--font);text-transform:capitalize;white-space:nowrap}
.cal-title span{display:flex;align-items:center;gap:2px;font:700 12px/1 var(--font);color:var(--text);background:var(--brand-soft);border-radius:var(--r-full);padding:5px 8px}
.cal-title .ic{width:14px;height:14px;stroke-width:2.2}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.cal-wd{text-align:center;font:var(--t-micro);color:var(--text-2);padding:2px 0 6px;text-transform:uppercase;letter-spacing:.4px}
.cal-wd.we{color:var(--brand-ink)}
.cal-day{border:0;background:none;border-radius:12px;min-height:44px;padding:6px 0 5px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;
  font:700 14px/1 var(--font);color:var(--text)}
.cal-day.out{visibility:hidden}
.cal-day.today{box-shadow:inset 0 0 0 1.5px var(--brand)}
.cal-day.sel{background:var(--text);color:var(--bg)}
.dots{display:flex;gap:3px;height:6px;align-items:center}
.dots i{width:6px;height:6px;border-radius:50%;display:block}
.d-mine{background:var(--text-2)} .d-ours{background:var(--brand)} .d-busy{box-shadow:inset 0 0 0 1.5px var(--text-2)} .d-hot{background:var(--danger)}
.cal-day.sel .d-mine{background:var(--bg)} .cal-day.sel .d-busy{box-shadow:inset 0 0 0 1.5px var(--bg)}
.legend{display:flex;gap:var(--s3);flex-wrap:wrap;justify-content:center;font:600 12px/1 var(--font);color:var(--text-2);margin-top:var(--s3)}
.legend span{display:flex;align-items:center;gap:5px}
.day-label{font:800 17px/1.2 var(--font);margin:var(--s5) 0 var(--s3);display:flex;align-items:baseline;gap:var(--s2)}
.day-label small{font:var(--t-caption);color:var(--text-2)}

/* ============ states ============ */
.state{text-align:center;padding:var(--s8) var(--s6);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);margin-top:var(--s4)}
.state .badge{width:56px;height:56px;border-radius:50%;background:var(--surface-2);color:var(--text-2);display:grid;place-items:center;margin:0 auto var(--s3)}
.state .badge .ic{width:26px;height:26px}
.state.err .badge{background:var(--danger-soft);color:var(--danger-ink)}
.state h3{font:800 17px/1.3 var(--font);margin:0 0 6px}
.state p{margin:0 auto;max-width:300px;font:500 14px/1.45 var(--font);color:var(--text-2)}
.state .btn{margin-top:var(--s4)}
.state.small{padding:var(--s5) var(--s4);margin-top:0}
.skel{height:68px;border-radius:var(--r-l);background:var(--surface);border:1px solid var(--border);margin-bottom:var(--s2);position:relative;overflow:hidden}
.skel::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,var(--surface-2),transparent);animation:shim 1.2s infinite;transform:translateX(-100%)}
.skel.line{height:16px;width:55%;border-radius:8px;border:0;margin:var(--s5) 0 var(--s2)}
@keyframes shim{to{transform:translateX(100%)}}

/* ============ composer: a block under the list, never over it ============ */
.composer{flex:none;padding:var(--s2) var(--s4) max(var(--s2), env(safe-area-inset-bottom));background:var(--bg);
  border-top:1px solid var(--border)}
.kb-open .composer{padding-bottom:var(--s2)}  /* the home-indicator inset sits under the keyboard */
.composer form{display:flex;gap:var(--s2);align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-l);
  padding:3px 3px 3px var(--s4)}
.composer form:focus-within{border-color:var(--brand)}
.composer input{flex:1;min-width:0;border:0;background:none;color:var(--text);font:500 16px/1.3 var(--font);outline:none;min-height:40px}
.composer input::placeholder{color:var(--text-3);opacity:1;font-weight:500}
.composer .add{width:44px;height:44px;border-radius:13px;border:0;background:var(--brand-fill);color:var(--on-brand);display:grid;place-items:center;cursor:pointer;flex:none;
  transition:transform var(--fast) var(--ease)}
.composer .add:active{transform:scale(.92)}
.composer .add .ic{width:22px;height:22px;stroke-width:2.4}
.composer .add[disabled]{opacity:.55;cursor:default}
.composer .add .spin{display:none;width:20px;height:20px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:rot .7s linear infinite}
.composer.busy .add .spin{display:block} .composer.busy .add .ic{display:none}
@keyframes rot{to{transform:rotate(360deg)}}
/* plain text, not a button: voice works in the chat with the bot */
.hint{margin:5px 2px 0;font:500 12px/1.3 var(--font);color:var(--text-2)}
.composer:focus-within .hint,.kb-open .hint{display:none}
@media (max-height:600px){ .hint{display:none} }

/* ============ sheet & toast ============ */
.sheet{position:fixed;inset:0;z-index:6;background:var(--scrim);display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity var(--base)}
.sheet.on{opacity:1;pointer-events:auto}
.sheet > div{width:100%;background:var(--surface);border-radius:var(--r-xl) var(--r-xl) 0 0;padding:10px var(--s4) calc(var(--s4) + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform var(--base) var(--ease);max-height:85vh;overflow:auto}
.sheet.on > div{transform:none}
.grab{width:36px;height:4px;border-radius:2px;background:var(--border);margin:0 auto var(--s3)}
.sheet-head{display:flex;gap:var(--s3);align-items:flex-start;padding:0 0 var(--s3);border-bottom:1px solid var(--border);margin-bottom:var(--s1)}
.sheet-head .tile{width:40px;height:40px;border-radius:12px;background:var(--surface-2);color:var(--text-2);display:grid;place-items:center;flex:none}
.sheet-head b{font:800 17px/1.3 var(--font);overflow-wrap:anywhere;display:block}
.sheet-head small{font:var(--t-caption);color:var(--text-2)}
.opt{display:flex;gap:var(--s3);align-items:center;width:100%;min-height:52px;border:0;background:none;text-align:left;font:600 16px/1.2 var(--font);
  padding:0 var(--s1);border-bottom:1px solid var(--border);cursor:pointer;color:var(--text)}
.opt .ic{color:var(--text-2)}
.opt .cur{margin-left:auto;font:var(--t-caption);color:var(--success-ink);display:flex;align-items:center;gap:4px}
.opt .cur .ic{color:var(--success-ink);width:16px;height:16px}
.opt.danger,.opt.danger .ic{color:var(--danger-ink)}
.opt.cancel{justify-content:center;border:0;color:var(--text-2)}
.toast{position:fixed;left:var(--s4);right:var(--s4);top:calc(var(--s3) + env(safe-area-inset-top));z-index:9;display:flex;gap:var(--s3);align-items:center;
  background:var(--text);color:var(--bg);border-radius:var(--r-m);padding:var(--s3) var(--s4);font:600 14px/1.4 var(--font);box-shadow:var(--shadow-2);
  transform:translateY(calc(-100% - 40px));transition:transform var(--base) var(--ease)}

  const theme = () => {
    document.documentElement.dataset.theme = tg.colorScheme === "dark" ? "dark" : "light";
    // Telegram's own header, background and bottom bar take the app's background, so there is no seam around it.
    try { const bg = getComputedStyle(document.body).backgroundColor; tg.setHeaderColor(bg); tg.setBackgroundColor(bg); tg.setBottomBarColor && tg.setBottomBarColor(bg); } catch(e){}
  };

}

const $ = id => document.getElementById(id);

const plural = (n, one, few, many) => n % 10 === 1 && n % 100 !== 11 ? one : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? few : many;

class ApiError extends Error { constructor(msg, status){ super(msg); this.status = status; } }
async function api(path, opts={}){
  if (DEMO) return demoApi(path, opts);
  let r;
  try { r = await fetch(path, {...opts, headers:{"Content-Type":"application/json","X-Init-Data":initData}}); }
  catch(e){ throw new ApiError("Нет связи с сервером. Проверьте интернет.", 0); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new ApiError(data.error || "Сервер ответил ошибкой. Попробуйте ещё раз.", r.status);
  return data;
}
function demoApi(path, opts){
  if (path === "/api/state") return S || demoState();
  const m = path.match(/\/api\/items\/(\d+)/);
  if (m && opts.method === "DELETE" || m && path.endsWith("/done")) S.items = S.items.filter(i => i.id != m[1]);
  if (m && path.endsWith("/who")) { const it = S.items.find(i => i.id == m[1]), w = JSON.parse(opts.body).who;
    it.assignee = w === "both" ? null : w === "me" ? 1 : 2; it.assignee_name = w === "both" ? "оба" : w === "me" ? "Лена" : "Артём"; }
  if (m && opts.method === "PATCH") { const it = S.items.find(i => i.id == m[1]); Object.assign(it, JSON.parse(opts.body)); return {item: it}; }
  if (path === "/api/add") {
    const text = JSON.parse(opts.body).text, buy = /^купи/i.test(text);
    const it = {id:Date.now(),kind:buy?"buy":"task",text:buy?text.replace(/^купи(ть)?\s*/i,""):text,assignee:2,assignee_name:"Артём",author:1,when:"",warnings:[]};
    S.items.unshift(it); return {items:[it]};
  }
  return {ok:true};
}

function toast(text, mood = "", ms = 4000, action = null){
  const t = $("toast"), ic = mood === "bad" ? "i-alert" : mood === "good" ? "i-check" : "i-logo";
  t.className = "toast " + mood; t.innerHTML = icon(ic) + `<span>${esc(text)}</span>` + (action ? `<button class="act">${esc(action.label)}</button>` : "");
  if (action) t.querySelector(".act").onclick = () => { t.classList.remove("on"); action.run(); };
  requestAnimationFrame(() => t.classList.add("on"));
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), ms);
}

function showLoading(){
  $("hello").innerHTML = `<span class="skel line" style="display:block;height:28px;width:60%;margin:0"></span>`;
  $("list").innerHTML = `<div class="skel line"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div>`;
}
function showFatal(e){
  $("hello").textContent = "Планер пары"; $("date").textContent = ""; $("summary").innerHTML = ""; $("invite").innerHTML = "";
  $("tabs").hidden = true; $("composer").hidden = true;
  const retry = `<button class="btn" data-retry="1">Повторить</button>`;
  $("list").innerHTML = e.status === 401
    ? stateHtml("i-lock", "Нет доступа", "Планер открывается только из бота: так мы понимаем, чей это дом. Откройте его кнопкой «Планер» в чате с ботом.", tg && initData ? `<button class="btn ghost" data-close-app="1">Вернуться в чат</button>` : "", true)
    : e.status === 0
      ? stateHtml("i-wifi", "Нет соединения", "Похоже, пропал интернет. Ваши дела никуда не делись, они на сервере. Подключитесь и попробуйте снова.", retry, true)
      : stateHtml("i-alert", "Не удалось загрузить планер", esc(e.message) + " Если повторится, напишите боту /help.", retry, true);
}

async function load(first){
  if (first) showLoading();
  if (!initData && !DEMO) return showFatal(new ApiError("", 401));
  try { S = await api("/api/state"); }
  catch(e){ if (first || !S) return showFatal(e); return toast(e.message, "bad"); }
  $("tabs").hidden = false; $("composer").hidden = false;
  render();
}

// ---------- header ----------
const initial = n => esc((n || "?").trim().charAt(0).toUpperCase());
// "Today" is the bot's calendar day (its time zone), so the app and the reminders agree even if the phone is elsewhere.
const todayIso = () => (S && S.today) || iso(new Date());
const weekday = dayIso => (new Date(dayIso + "T12:00").getDay() + 6) % 7;
function onDay(dayIso){
  const wd = weekday(dayIso);
  return S.items.filter(i => i.kind !== "buy" && (i.day === dayIso || (i.kind === "busy" && i.weekday === wd)));
}
const shortDate = dayIso => new Date(dayIso + "T12:00").toLocaleDateString("ru-RU", {day:"numeric", month:"short"}).replace(".", "");

function header(){
  const me = S.me, p = S.partner, t = todayIso();
  $("pair").innerHTML = `<span class="ava" title="${esc(me.name)}">${initial(me.name)}</span>` +
    (p ? `<span class="ava" title="${esc(p.name)}">${initial(p.name)}</span>` : `<span class="ava wait" title="Ждём вторую половину">?</span>`);
  const h = new Date().getHours(), hi = h < 5 ? "доброй ночи" : h < 12 ? "доброе утро" : h < 18 ? "добрый день" : "добрый вечер";
  $("date").textContent = new Date(t + "T12:00").toLocaleDateString("ru-RU", {weekday:"long", day:"numeric", month:"long"}) + " · " + hi;
  $("hello").textContent = p ? `${me.name} и ${p.name}` : `${me.name}, пока соло`;

  // Counters are label first ("Купить 6"), so no number has to agree with a noun.
  const today = S.items.filter(i => (i.kind === "task" || i.kind === "event") && i.day === t);
  const buys = S.items.filter(i => i.kind === "buy");
  const ours = S.items.filter(i => i.kind === "event" && i.day && i.day >= t).sort((a, b) => a.day < b.day ? -1 : 1)[0];
  const hot = S.items.filter(i => i.hot), late = hot.some(isLate);
  const busyToday = onDay(t).filter(i => i.kind === "busy" && i.assignee !== me.id);
  let html = `<div class="stats">
    <button class="stat${hot.length ? " hot" + (late ? " late" : "") : " muted"}" data-goto="hot" aria-label="Горит: ${hot.length}"><span>🔥 Горит</span><b>${hot.length}</b></button>
    <button class="stat${today.length ? "" : " muted"}" data-goto="month" data-day="${t}" aria-label="Сегодня: ${today.length}"><span>Сегодня</span><b>${today.length}</b></button>
    <button class="stat${buys.length ? "" : " muted"}" data-goto="buy" aria-label="Купить: ${buys.length}"><span>Купить</span><b>${buys.length}</b></button></div>`;
  if (ours) html += `<button class="plan" data-goto="month" data-day="${ours.day}" aria-label="Ближайший общий план: ${esc(ours.when)}, ${esc(ours.text)}">${icon("i-heart")}<span><small>Вместе: </small><b>${esc(ours.when)}</b> · ${esc(ours.text)}</span>${icon("i-right", "ic go")}</button>`;
  busyToday.forEach(b => { html += `<div class="note">${icon("i-clock")}<span>Сегодня ${esc(b.assignee_name)}: ${esc(b.text.toLowerCase())}. Совместное лучше на другой день.</span></div>`; });
  $("summary").innerHTML = html;
  $("invite").innerHTML = (!p && S.invite) ? `<div class="invite"><p><b>Позовите вторую половину</b>Без неё напоминать будет некому. Ссылка одноразовая, работает 48 часов.</p><button class="btn" id="share">Позвать</button></div>` : "";
  if ($("share")) $("share").onclick = () => {
    const url = "https://t.me/share/url?url=" + encodeURIComponent(S.invite) + "&text=" + encodeURIComponent("Давай вести наш семейный планер");
    tg && initData ? tg.openTelegramLink(url) : window.open(url);
  };
}

// ---------- card ----------
const avaFor = (name, mine, cls = "") => `<span class="ava ${cls}" style="background:var(${mine ? "--brand-fill" : "--success"})">${initial(name)}</span>`;
function whoHtml(it){
  if (it.kind === "buy") return "";
  if (it.assignee == null) return `<div class="who">${icon("i-users")}вместе</div>`;
  const mine = it.assignee === S.me.id;
  return `<div class="who">${avaFor(it.assignee_name, mine)}${mine ? "ты" : esc(it.assignee_name)}</div>`;
}
// Burning past its date (red) vs. a promise that has just hung around for a week (amber); both are the server's "hot".
const isLate = it => !!it.hot && !/^висит/.test(it.when || "");
function dueHtml(it){
  if (!it.when) return "";  // no date: nothing is shown rather than an invented one
  const w = it.when;
  if (isLate(it)) return `<div class="due late">${icon("i-flame")}${esc(w)}</div>`;
  if (it.kind === "event" && it.day && it.day < todayIso()) return `<div class="due past">${icon("i-cal")}${esc(w)}</div>`;
  if (it.day === todayIso()) return `<div class="due today">${icon("i-cal")}${esc(w)}</div>`;
  if (/^висит/.test(w)) return `<div class="due hang">${icon("i-hourglass")}${esc(w)}</div>`;
  if (/^кажд/.test(w)) return `<div class="due">${icon("i-repeat")}${esc(w)}</div>`;
  return `<div class="due">${icon("i-cal")}${esc(w)}</div>`;
}
const clean = w => w.replace(/^⚠️\s*/, "");
// In the card only the first sentence (what clashes with what, and when); the full text is in the sheet.
const lead = w => clean(w).split(/(?<=[»".)])\.?\s+(?=[А-ЯЁ])/)[0].replace(/\.$/, "");
const warnLabel = s => esc(s).replace(/^(Накладка):/, "<b>$1:</b>");
function warnHtml(it){
  return (it.warnings || []).map(w => `<div class="warn">${icon("i-alert")}<span>${warnLabel(lead(w))}. <u data-more="${it.id}">Решить</u></span></div>`).join("");
}
function cardHtml(it){
  const tick = it.kind === "busy" ? "" : `<button class="tick" data-done="${it.id}" aria-label="${it.kind === "buy" ? "Куплено" : "Сделано"}: ${esc(it.text)}"><i>${icon("i-check")}</i></button>`;
  const past = it.kind === "event" && it.day && it.day < todayIso();
  return `<div class="card k-${it.kind}${it.hot ? " hot" : ""}${isLate(it) ? " late" : ""}${past ? " past" : ""}" id="i${it.id}" data-more="${it.id}">
    <span class="tile">${icon(pic(it))}</span>
    <div class="body"><div class="title">${esc(it.text)}</div>${dueHtml(it)}${whoHtml(it)}${warnHtml(it)}</div>${tick}</div>`;
}
function section(title, items, lead = "", cls = "", id = ""){
  if (!items.length) return "";
  return `<div class="sec ${cls}"${id ? ` id="${id}"` : ""}>${lead}<h2>${esc(title)}</h2><span class="count">${items.length}</span></div>` + items.map(cardHtml).join("");
}

// ---------- screens ----------
// [normal, narrow screen]: a hint, never pre-filled text
const PLACEHOLDER = {tasks:["Добавить дело или покупку…", "Дело или покупка…"], month:["Добавить план на день…", "План на день…"],
                     buy:["Добавить покупку…", "Что купить…"], busy:["Когда ты занят…", "Когда ты занят…"]};
function render(){
  header();
  const me = S.me, p = S.partner;
  const by = k => S.items.filter(i => k === "tasks" ? (i.kind === "task" || i.kind === "event") : i.kind === k);
  const hot = S.items.filter(i => i.hot);
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab));
  $("input").placeholder = PLACEHOLDER[tab][innerWidth <= 360 ? 1 : 0];
  if (tab === "month") { $("list").innerHTML = monthHtml(); return; }
  const items = by(tab);
  let html;
  if (!items.length) {
    html = {tasks: stateHtml("p-home", "Дел нет. Подозрительно уютно", "Напишите внизу, что обещали друг другу. Например: «ты обещал вкрутить лампочку до субботы»."),
            buy: stateHtml("i-bag", "Список покупок пуст", "Холодильник, видимо, тоже скоро опустеет. Напишите «купить молоко и хлеб», и список появится."),
            busy: stateHtml("i-sofa", "Никто не занят", "Отметьте свои постоянные дела, чтобы вторая половина не планировала на этот вечер совместное. Например: «по четвергам у меня футбол»."),
           }[tab];
  } else if (tab === "tasks") {
    // Order of attention: burning, today, the rest of the promises, then plans ahead.
    const t = todayIso(), cold = items.filter(i => !i.hot);
    const rest = cold.filter(i => i.day !== t), todo = rest.filter(i => i.kind === "task");
    const ev = rest.filter(i => i.kind === "event"), gone = ev.filter(i => i.day && i.day < t);
    const plans = ev.filter(i => !gone.includes(i)).sort((a, b) => (a.day || "9") < (b.day || "9") ? -1 : 1);
    html = (hot.length ? section("🔥 ГОРИТ", hot, "", "hot", "sec-hot")
                       : `<div class="calm">${icon("i-check")}<span>Сегодня ничего не горит. Подозрительно.</span></div>`)
         + section("Сегодня", cold.filter(i => i.day === t), `<span class="ava both">${icon("i-cal")}</span>`)
         + section("Твои дела", todo.filter(i => i.assignee === me.id), avaFor(me.name, true))
         + (p ? section(`Дела: ${p.name}`, todo.filter(i => i.assignee === p.id), avaFor(p.name, false)) : "")
         + section("Общие дела", todo.filter(i => i.assignee == null), `<span class="ava both">${icon("i-users")}</span>`)
         + section("Ближайшие планы", plans, `<span class="ava both">${icon("i-heart")}</span>`)
         + section("Прошедшие планы", gone, "", "past");
  } else if (tab === "busy") {
    html = section(me.name, items.filter(i => i.assignee === me.id), avaFor(me.name, true))
         + (p ? section(p.name, items.filter(i => i.assignee === p.id), avaFor(p.name, false)) : "");
  } else html = section("Купить", items);
  $("list").innerHTML = html;
}

// ---------- calendar ----------
const WD = ["пн", "вт", "ср", "чт", "пт", "сб", "вс"];
const monday = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return x; };
// Shapes as well as colours: filled coral — together, filled grey — personal, ring — someone busy, red — burning.
function dots(list){
  const kinds = new Set(list.map(i => i.hot ? "hot" : i.kind === "busy" ? "busy" : i.assignee == null ? "ours" : "mine"));
  return ["hot", "ours", "mine", "busy"].filter(k => kinds.has(k)).slice(0, 3).map(k => `<i class="d-${k}"></i>`).join("");
}
function dayCell(date, t){
  const key = iso(date), list = onDay(key);
  const label = date.toLocaleDateString("ru-RU", {day:"numeric", month:"long"}) + (list.length ? `, ${list.length} ${plural(list.length, "запись", "записи", "записей")}` : "");
  const cls = [key === t ? "today" : "", key === calDay ? "sel" : ""].join(" ");
  return `<button class="cal-day ${cls}" data-day="${key}" aria-label="${label}"${key === calDay ? ' aria-current="date"' : ""}>${date.getDate()}<span class="dots">${dots(list)}</span></button>`;
}
// Collapsed: the current week strip. Tap the title to unfold the whole month.
function monthHtml(){
  const t = todayIso(), now = new Date(t + "T12:00");
  if (!calDay) calDay = t;
  if (!calWeek) calWeek = monday(now);
  if (!calMonth) calMonth = new Date(now.getFullYear(), now.getMonth(), 1);
  let cells = WD.map((w, i) => `<div class="cal-wd${i > 4 ? " we" : ""}">${w}</div>`).join(""), title;
  if (calOpen) {
    const y = calMonth.getFullYear(), m = calMonth.getMonth();
    const first = (new Date(y, m, 1).getDay() + 6) % 7, days = new Date(y, m + 1, 0).getDate();
    for (let i = 0; i < first; i++) cells += `<div class="cal-day out"></div>`;
    for (let d = 1; d <= days; d++) cells += dayCell(new Date(y, m, d), t);
    title = calMonth;
  } else {
    for (let i = 0; i < 7; i++) { const d = new Date(calWeek); d.setDate(d.getDate() + i); cells += dayCell(d, t); }
    title = new Date(calWeek.getFullYear(), calWeek.getMonth(), calWeek.getDate() + 3);
  }
  const name = title.toLocaleDateString("ru-RU", {month: "long", year: "numeric"}).replace(" г.", "");
  const sel = onDay(calDay);
  const label = new Date(calDay + "T12:00").toLocaleDateString("ru-RU", {weekday: "long", day: "numeric", month: "long"});
  const list = sel.length ? sel.map(cardHtml).join("")
    : `<div class="state small"><h3>Свободный день</h3><p>Ни дел, ни планов. Можно наконец ничего не делать вместе.</p></div>`;
  return `<div class="cal"><div class="cal-head">
      <button class="nav" data-cal="-1" aria-label="${calOpen ? "Предыдущий месяц" : "Предыдущая неделя"}">${icon("i-left")}</button>
      <button class="cal-title" data-caltoggle="1" aria-expanded="${calOpen}"><b>${esc(name)}</b><span>${calOpen ? "неделя" : "месяц"}${icon(calOpen ? "i-up" : "i-down")}</span></button>
      <button class="nav" data-cal="1" aria-label="${calOpen ? "Следующий месяц" : "Следующая неделя"}">${icon("i-right")}</button></div>
    <div class="cal-grid">${cells}</div>
    <div class="legend"><span><span class="dots"><i class="d-ours"></i></span>вместе</span><span><span class="dots"><i class="d-mine"></i></span>личное</span><span><span class="dots"><i class="d-busy"></i></span>занят</span><span><span class="dots"><i class="d-hot"></i></span>горит</span></div></div>
    <div class="day-label">${esc(label.charAt(0).toUpperCase() + label.slice(1))} <small>${sel.length ? sel.length + " " + plural(sel.length, "запись", "записи", "записей") : ""}</small></div>${list}`;
}

// ---------- interactions ----------
const smooth = () => matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth";
$("tabs").onclick = e => { const b = e.target.closest("button"); if (b) { tab = b.dataset.tab; render(); $("tabs").scrollIntoView({block:"start"}); } };

$("summary").onclick = e => {
  const g = e.target.closest("[data-goto]"); if (!g) return;
  tab = g.dataset.goto === "hot" ? "tasks" : g.dataset.goto;
  if (g.dataset.day) { calDay = g.dataset.day; calWeek = monday(new Date(calDay + "T12:00")); calOpen = false; }
  render();
  const target = g.dataset.goto === "hot" && $("sec-hot");
  (target || $("tabs")).scrollIntoView({behavior: smooth(), block: "start"});
};

const DONE_LINES = ["Опа. Человек слова!", "Обещание выполнено.", "Готово. Вторая половина уже в курсе."];
document.body.addEventListener("click", async e => {
  if (e.target.closest("[data-retry]")) return load(true);
  if (e.target.closest("[data-close-app]")) return tg && tg.close();
  if (!e.target.closest("#list")) return;
  const nav = e.target.closest("[data-cal]"), day = e.target.closest("[data-day]");
  if (e.target.closest("[data-caltoggle]")) {
    calOpen = !calOpen;
    const d = new Date(calDay + "T12:00");
    if (calOpen) calMonth = new Date(d.getFullYear(), d.getMonth(), 1); else calWeek = monday(d);
    render(); return;
  }
  if (nav) {
    if (calOpen) calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + +nav.dataset.cal, 1);
    else calWeek = new Date(calWeek.getFullYear(), calWeek.getMonth(), calWeek.getDate() + 7 * nav.dataset.cal);
    render(); return;
  }
  if (day) { calDay = day.dataset.day; render(); return; }
  const d = e.target.closest("[data-done]");
  if (d) {
    const id = +d.dataset.done, el = $("i" + id), it = S.items.find(i => i.id === id);
    if (el.classList.contains("done")) return;
    el.classList.add("done"); tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("success");
    try { await api(`/api/items/${id}/done`, {method:"POST"}); }
    catch(err){ el.classList.remove("done"); toast("Не отметилось: " + err.message, "bad"); return; }
    // The card fades out; «Вернуть» cancels that if it comes first, so the list never drops a restored item.
    const t1 = setTimeout(() => { el.classList.add("gone"); t2 = setTimeout(() => { S.items = S.items.filter(i => i.id !== id); render(); }, 260); }, 500);
    let t2 = 0;
    toast(it && it.kind === "buy" ? "Куплено. Холодильник благодарит." : DONE_LINES[id % 3], "good", 6000, {label: "Вернуть", run: async () => {
      clearTimeout(t1); clearTimeout(t2);
      try { await api(`/api/items/${id}/undo`, {method:"POST"}); toast("Вернул в список.", "good"); }
      catch(err){ toast("Не вернулось: " + err.message, "bad"); }
      await load();
    }});
    return;
  }
  const m = e.target.closest("[data-more]");
  if (m) openSheet(S.items.find(i => i.id === +m.dataset.more));
});

function closeSheet(){ $("sheet").classList.remove("on"); $("sheet").setAttribute("aria-hidden", "true"); }
function openSheet(it){
  if (!it) return;
  const rows = [], cur = it.assignee == null ? "both" : it.assignee === S.me.id ? "me" : "partner";
  const mark = w => w === cur ? `<span class="cur">${icon("i-check")}сейчас</span>` : "";
  if (it.kind === "task" || it.kind === "event") {
    rows.push(`<button class="opt" data-who="me">${icon("i-user")}<span>Это на мне</span>${mark("me")}</button>`);
    if (S.partner) rows.push(`<button class="opt" data-who="partner">${icon("i-send")}<span>Передать: ${esc(S.partner.name)}</span>${mark("partner")}</button>`);
    rows.push(`<button class="opt" data-who="both">${icon("i-users")}<span>Делаем вместе</span>${mark("both")}</button>`);
  }
  if (it.day && (it.warnings || []).length) rows.push(`<button class="opt" data-openday="${it.day}">${icon("i-cal")}<span>Открыть этот день в календаре</span></button>`);
  rows.push(`<button class="opt" data-edit="1">${icon("p-tool")}<span>${it.kind === "buy" || it.weekday != null ? "Изменить название" : "Изменить название или срок"}</span></button>`);
  rows.push(`<button class="opt danger" data-del="1">${icon("i-trash")}<span>Удалить</span></button><button class="opt cancel" data-close="1">Отмена</button>`);
  const sub = [it.when, (it.warnings || []).length ? "есть накладка" : ""].filter(Boolean).join(" · ");
  const dated = it.kind !== "buy" && it.weekday == null;
  const form = `<form class="edit" id="edit" hidden>
      <label>Название<input name="text" maxlength="300" value="${esc(it.text)}" autocomplete="off"></label>
      ${dated ? `<div class="row"><label>Дата<input type="date" name="day" value="${esc(it.day || "")}"></label><label>Время<input type="time" name="time" value="${esc(it.time || "")}"></label></div>` : ""}
      <div class="err" id="edit-err" role="alert"></div>
      <button class="btn" type="submit">Сохранить</button></form>`;
  $("sheet-body").innerHTML = `<div class="sheet-head"><span class="tile">${icon(pic(it))}</span><div><b>${esc(it.text)}</b>${sub ? `<small>${esc(sub)}</small>` : ""}</div></div>`
    + (it.warnings || []).map(w => `<div class="warn" style="margin:var(--s2) 0">${icon("i-alert")}<span>${warnLabel(clean(w))}</span></div>`).join("")
    + form + rows.join("");
  $("edit").onsubmit = async e => {
    e.preventDefault();
    const f = new FormData($("edit")), body = {text: f.get("text")};
    if (dated) { body.day = f.get("day") || null; body.time = f.get("time") || null; }
    const btn = $("edit").querySelector(".btn"); if (btn.disabled) return;
    btn.disabled = true; $("edit-err").textContent = "";
    try { await api(`/api/items/${it.id}`, {method:"PATCH", body:JSON.stringify(body)}); }
    catch(err){ $("edit-err").textContent = err.message; btn.disabled = false; return; }
    toast("Исправлено.", "good"); closeSheet(); await load();
  };
  $("sheet").classList.add("on"); $("sheet").setAttribute("aria-hidden", "false");
  $("sheet").onclick = async e => {
    const b = e.target.closest("button");
    if (e.target === $("sheet") || (b && b.dataset.close)) return closeSheet();
    if (!b || b.closest(".edit")) return;
    if (b.dataset.edit) { $("edit").hidden = false; b.hidden = true; $("edit").querySelector("input").focus(); return; }
    if (b.dataset.openday) {
      closeSheet(); tab = "month"; calDay = b.dataset.openday; calWeek = monday(new Date(calDay + "T12:00")); calOpen = false;
      render(); $("tabs").scrollIntoView({block:"start"}); return;
    }
    if (b.dataset.del && !b.dataset.sure) { b.dataset.sure = "1"; b.querySelector("span").textContent = "Точно удалить? Нажмите ещё раз"; return; }
    try {
      if (b.dataset.del) { await api(`/api/items/${it.id}`, {method:"DELETE"}); toast("Удалено.", "good"); }
      if (b.dataset.who) { await api(`/api/items/${it.id}/who`, {method:"POST", body:JSON.stringify({who:b.dataset.who})}); toast(b.dataset.who === "partner" ? "Передано. Без обид." : "Готово, переназначено.", "good"); }
    } catch(err){ toast("Не сохранилось: " + err.message, "bad"); }
    closeSheet();
    await load();
  };
}
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

// The draft survives an accidental close or a failed save.
$("input").value = store.get("draft");
$("input").oninput = () => store.set("draft", $("input").value);
let sending = false;  // one request at a time: a double tap or Enter+tap must not save the line twice
$("form").onsubmit = async e => {
  e.preventDefault();
  if (sending) return;
  const text = $("input").value.trim(); if (!text) return $("input").focus();
  sending = true; $("add").disabled = true; $("composer").classList.add("busy"); $("form").setAttribute("aria-busy", "true");
  try {
    const r = await api("/api/add", {method:"POST", body:JSON.stringify({text})});
    $("input").value = ""; store.set("draft", "");
    const it = r.items[0];
    tab = it.kind === "buy" ? "buy" : it.kind === "busy" ? "busy" : "tasks";
    const warn = r.items.flatMap(i => i.warnings || []);
    if (warn.length) toast(clean(warn[0]), "bad", 7000);
    else toast(`Записал: ${r.items.map(i => i.text).join(", ")}`, "good");
    await load();
    r.items.forEach(i => { const el = $("i" + i.id); if (el) { el.classList.add("fresh"); el.scrollIntoView({block:"nearest", behavior: smooth()}); } });
  } catch(err){ toast(err.status === 400 ? err.message : "Не сохранилось: " + err.message + " Текст остался в поле.", "bad", 6000); }
  finally { sending = false; $("add").disabled = false; $("composer").classList.remove("busy"); $("form").removeAttribute("aria-busy"); }
};

// The shell is exactly as tall as what is visible: the on-screen keyboard (iOS keeps the page under it, Android
// resizes) and Telegram's half-open sheet both shrink the list area, and the composer stays right above.
function fit(){
  const vv = window.visualViewport, h = vv ? vv.height : innerHeight;
  const root = document.documentElement.style;
  root.setProperty("--app-h", Math.round(h) + "px");
  root.setProperty("--app-top", Math.round(vv ? vv.offsetTop : 0) + "px");
  document.body.classList.toggle("kb-open", innerHeight - h > 120 || (!!tg && tg.viewportStableHeight > 0 && tg.viewportStableHeight - h > 120));
}
fit();
if (window.visualViewport) { visualViewport.addEventListener("resize", fit); visualViewport.addEventListener("scroll", fit); }
window.addEventListener("resize", fit);
if (tg && tg.onEvent) tg.onEvent("viewportChanged", fit);
// iOS scrolls the whole page to reveal a focused field; the shell already moved, so put the page back.
$("input").addEventListener("focus", () => setTimeout(() => { window.scrollTo(0, 0); fit(); }, 50));
window.addEventListener("online", () => S || load(true));

load(true);
</script>
